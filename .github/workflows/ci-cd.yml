name: CI

# 双闸门 + 测试 的远端等效（对齐 githooks/pre-commit 三闸门）。
# 必过状态检查名 = 作业名 "gates"（与仓库分支保护 Required status check 对应）。
on:
  push:
    branches: [master, launch-ready]
  pull_request:
    branches: [master]

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 闸门1 · 契约校验（schema 66 / 注册表 6）
        run: python design/contracts/validate_contracts.py

      - name: 闸门2 · PRD-HLD 追溯
        run: python design/check_prd_hld_traceability.py

      - name: scaffold 测试套件（15 文件）
        run: |
          cd scaffold/src
          fail=0
          for t in $(ls ../tests/test_*.py | sort); do
            b=$(basename "$t" .py)
            echo "--- $b ---"
            python -c "import sys; sys.path[:0]=['.', '../tests']; import runpy; runpy.run_path('../tests/$b.py', run_name='__main__')" || fail=1
          done
          exit $fail

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Java 业务侧编译 (server-java · ADR-002)
        working-directory: server-java
        run: mvn -B compile

      - name: Java 业务侧测试 (server-java · ADR-002)
        working-directory: server-java
        run: mvn -B test

  server-python:
    name: server-python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-python
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖（FastAPI/pytest/ruff）
        run: pip install --upgrade pip && pip install "fastapi>=0.110" "uvicorn>=0.27" "pydantic>=2.6" "httpx>=0.27" "pytest>=8.0" "ruff>=0.5"

      - name: Ruff lint（E/F/I 阻断集；当前非阻断，待代码清理后收紧为阻断）
        run: ruff check app tests || true

      - name: Pytest（B01–B05/B10/B11 + 护栏 + 鉴权 fail-closed）
        run: pytest
