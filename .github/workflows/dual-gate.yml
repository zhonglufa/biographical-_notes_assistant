name: dual-gate

# 双闸门门禁（云端版）：PRD/HLD 防漂移 + 接口契约自洽。
# 在 push 与 pull_request 时，只要改动涉及 prd/ 或 design/ 即自动跑双闸门；
# 任一闸门失败（红色 X）即阻断该次校验。配合仓库分支保护规则（Settings → Branches）
# 将本工作流设为“必需检查（required）”，即可在合并前强制双闸门全绿。

on:
  push:
    branches: [main, master]
    paths:
      - 'prd/**'
      - 'design/**'
  pull_request:
    paths:
      - 'prd/**'
      - 'design/**'
  # 手动触发：在 Actions 页点 “Run workflow” 强制跑一次（用于验证云端校验器）。
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Gate 1 — contract schema validation
        run: python design/contracts/validate_contracts.py
      - name: Gate 2 — PRD/HLD traceability
        run: python design/check_prd_hld_traceability.py
