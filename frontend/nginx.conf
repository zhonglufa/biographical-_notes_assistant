server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退（Vue History 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代前端 /api 到业务后端 server-java（compose 网络内）
    # 当前假设 server-java 控制器以 /api 为前缀，故 proxy_pass 不带 URI、保留完整路径转发：
    #   /api/v1/x  ->  server-java:8080/api/v1/x
    # 若 server-java 控制器【未】以 /api 为前缀，请将下行改为：
    #   proxy_pass http://server-java:8080/;   （加尾斜杠以剥离 /api 前缀）
    location /api/ {
        proxy_pass http://server-java:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
