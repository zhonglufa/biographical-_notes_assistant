<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>U2 岗位浏览 · 搜索/筛选/收藏/忽略（A07/A08）</title>
<style>
  :root{
    --c-primary:#4F46E5; --c-primary-hover:#4338CA; --c-primary-soft:#EEF2FF;
    --c-accent:#7C3AED; --c-success:#16A34A; --c-success-soft:#ECFDF3; --c-success-border:#ABEFC6;
    --c-danger:#DC2626; --c-danger-soft:#FEF3F2; --c-danger-border:#FECDCA;
    --c-warning:#D97706; --c-warning-soft:#FFFAEB; --c-warning-border:#FDE68A;
    --c-info:#2563EB; --c-info-soft:#EFF6FF; --c-info-border:#BFDBFE;
    --c-ink:#0F172A; --c-body:#334155; --c-muted:#64748B; --c-faint:#94A3B8;
    --c-border:#E2E8F0; --c-subtle:#F1F5F9; --c-page:#F8FAFC; --c-surface:#FFFFFF;
    --r-sm:6px; --r-md:8px; --r-lg:12px; --r-full:999px;
    --f-base:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--f-base);background:var(--c-page);color:var(--c-body);font-size:14px;line-height:1.55;}
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;}
  .side{background:var(--c-surface);border-right:1px solid var(--c-border);display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:8px;padding:18px 16px;font-weight:700;color:var(--c-ink);font-size:15px;border-bottom:1px solid var(--c-border);}
  .brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--c-primary),var(--c-accent));color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .nav{padding:10px;overflow:auto;flex:1;}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);color:var(--c-body);text-decoration:none;font-size:14px;margin-bottom:2px;cursor:pointer;}
  .nav a:hover{background:var(--c-subtle);}
  .nav a.active{background:var(--c-primary-soft);color:var(--c-primary);font-weight:600;}
  .nav .ic{width:18px;text-align:center;opacity:.85;}
  .nav .tag{margin-left:auto;font-size:11px;background:var(--c-danger);color:#fff;border-radius:var(--r-full);padding:1px 7px;}
  .side-foot{padding:12px 16px;border-top:1px solid var(--c-border);font-size:12px;color:var(--c-faint);}
  .main{display:flex;flex-direction:column;min-width:0;}
  .top{height:56px;background:var(--c-surface);border-bottom:1px solid var(--c-border);display:flex;align-items:center;gap:16px;padding:0 20px;}
  .top .search{flex:1;max-width:420px;padding:8px 12px;border:1px solid var(--c-border);border-radius:var(--r-sm);color:var(--c-muted);font-size:13px;}
  .top .spacer{flex:1;}
  .top .plan{font-size:12px;background:var(--c-primary-soft);color:var(--c-primary);padding:4px 10px;border-radius:var(--r-full);font-weight:600;}
  .top .bell{position:relative;font-size:18px;cursor:pointer;}
  .top .bell .dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--c-danger);}
  .top .avatar{width:30px;height:30px;border-radius:50%;background:var(--c-subtle);color:var(--c-muted);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .content{padding:24px;overflow:auto;max-width:1100px;}
  .page-head h1{font-size:20px;margin:0;color:var(--c-ink);}
  .page-head .sub{color:var(--c-muted);font-size:13px;margin-top:4px;}
  .btn{font-family:var(--f-base);font-size:14px;font-weight:500;border-radius:var(--r-sm);padding:8px 14px;border:1px solid transparent;cursor:pointer;}
  .btn-primary{background:var(--c-primary);color:#fff;}
  .btn-primary:hover{background:var(--c-primary-hover);}
  .btn-secondary{background:var(--c-surface);color:var(--c-body);border-color:var(--c-border);}
  .btn-secondary:hover{background:var(--c-subtle);}
  .btn-ghost{background:transparent;color:var(--c-primary);}
  .btn-sm{padding:5px 12px;font-size:13px;}
  .card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;}
  .badge{display:inline-flex;font-size:12px;font-weight:600;padding:2px 10px;border-radius:var(--r-full);}
  .badge-success{background:var(--c-success-soft);color:var(--c-success);border:1px solid var(--c-success-border);}
  .badge-info{background:var(--c-info-soft);color:var(--c-info);border:1px solid var(--c-info-border);}
  .badge-warning{background:var(--c-warning-soft);color:var(--c-warning);border:1px solid var(--c-warning-border);}
  .badge-neutral{background:var(--c-subtle);color:var(--c-muted);border:1px solid var(--c-border);}
  .filter{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-lg);padding:14px;}
  .input,.select{font-family:var(--f-base);font-size:14px;padding:8px 10px;border:1px solid var(--c-border);border-radius:var(--r-sm);color:var(--c-ink);}
  .chip{font-size:13px;padding:6px 12px;border-radius:var(--r-full);border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-body);cursor:pointer;}
  .chip.on{background:var(--c-primary-soft);color:var(--c-primary);border-color:var(--c-primary);font-weight:600;}
  .job{display:flex;gap:14px;align-items:flex-start;}
  .job .match{flex-shrink:0;width:56px;height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;border:1px solid;}
  .job .match small{font-size:10px;font-weight:500;color:var(--c-muted);}
  .job .info{flex:1;min-width:0;}
  .job .info .title{font-weight:600;color:var(--c-ink);font-size:15px;}
  .job .info .meta{color:var(--c-muted);font-size:13px;margin:2px 0 6px;}
  .job .info .why{font-size:13px;color:var(--c-body);background:var(--c-subtle);border-radius:var(--r-sm);padding:8px 10px;}
  .job .info .why b{color:var(--c-primary);}
  .job .acts{display:flex;flex-direction:column;gap:6px;flex-shrink:0;align-items:flex-end;}
  .job.ignored{opacity:.5;}
  .tag-a{font-size:11px;background:var(--c-accent);color:#fff;border-radius:var(--r-full);padding:1px 8px;margin-left:6px;vertical-align:middle;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--c-ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:var(--r-sm);opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:16px 0;color:var(--c-muted);font-size:13px;}
  .empty{border:2px dashed var(--c-border);border-radius:var(--r-lg);padding:36px;text-align:center;color:var(--c-faint);}
  .count{color:var(--c-muted);font-size:13px;}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">简</span> 简投 · AI 助手</div>
    <nav class="nav" id="nav">
      <a data-page="home"><span class="ic">🏠</span> 首页 / 待确认投递 <span class="tag">3</span></a>
      <a data-page="resume"><span class="ic">📄</span> 简历工作台</a>
      <a class="active" data-page="jobs"><span class="ic">🔍</span> 岗位浏览</a>
      <a data-page="apps"><span class="ic">📨</span> 投递管理</a>
      <a data-page="strategy"><span class="ic">⚙️</span> 策略配置</a>
      <a data-page="adapter"><span class="ic">🔌</span> 适配器</a>
      <a data-page="interview"><span class="ic">💬</span> 面试模拟</a>
      <a data-page="notify"><span class="ic">🔔</span> 通知中心</a>
      <a data-page="report"><span class="ic">📊</span> 每日日报</a>
      <a data-page="member"><span class="ic">⭐</span> 会员</a>
      <a data-page="settings"><span class="ic">🧰</span> 设置</a>
    </nav>
    <div class="side-foot">本机 Agent · v1.3<br>账号状态：<span style="color:var(--c-success)">正常</span></div>
  </aside>

  <section class="main">
    <header class="top">
      <div class="search">搜索岗位、公司、技能…</div>
      <div class="spacer"></div>
      <span class="plan">Pro 会员</span>
      <span class="bell">🔔<span class="dot"></span></span>
      <span class="avatar">钟</span>
    </header>

    <div class="content">
      <div class="page-head">
        <div>
          <h1>岗位浏览</h1>
          <div class="sub">搜索 / 筛选招聘平台岗位，按 AI 匹配度排序；收藏送入待确认投递，忽略后不再推送。<span class="tag-a">A07 / A08</span></div>
        </div>
      </div>

      <!-- 筛选（A07 查询参数语义） -->
      <div class="filter">
        <input class="input" id="kw" placeholder="关键词：Java / 后端 / 微服务" style="min-width:220px" />
        <input class="input" id="loc" placeholder="城市：上海" style="min-width:140px" />
        <input class="input" id="sal" placeholder="月薪下限(K)：15" style="width:130px" />
        <button class="btn btn-primary btn-sm" onclick="doSearch()">搜索</button>
        <span class="count" id="total"></span>
      </div>
      <div style="margin-bottom:12px">
        <span style="font-size:13px;color:var(--c-muted)">平台：</span>
        <span class="chip on" data-pl="">全部</span>
        <span class="chip" data-pl="boss">Boss直聘</span>
        <span class="chip" data-pl="liepin">猎聘</span>
        <span class="chip" data-pl="zhaopin">智联</span>
        <span class="chip" data-pl="51job">前程无忧</span>
        <span class="chip" data-pl="lagou">拉勾</span>
      </div>

      <div id="list"></div>
      <div class="pager" id="pager"></div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== Mock 数据（语义对齐 jobs-list.response / jobs-favorite）=====
const PLAT = {boss:'Boss直聘', liepin:'猎聘', zhaopin:'智联', '51job':'前程无忧', lagou:'拉勾'};
function band(score){ return score==null?null:(score>=80?'green':score>=60?'blue':'gray'); }
function bandStyle(b){
  if(b==='green') return {bg:'var(--c-success-soft)',bd:'var(--c-success-border)',fg:'var(--c-success)'};
  if(b==='blue')  return {bg:'var(--c-info-soft)',bd:'var(--c-info-border)',fg:'var(--c-info)'};
  if(b==='gray')  return {bg:'var(--c-subtle)',bd:'var(--c-border)',fg:'var(--c-muted)'};
  return {bg:'var(--c-subtle)',bd:'var(--c-border)',fg:'var(--c-faint)'};
}
let jobs = [
  {jobId:'j-2001',title:'Java 开发工程师',company:'某科技公司',platformId:'boss',salaryMin:15,salaryMax:25,location:'上海',source:'search',matchScore:92,matchReason:'技能 87% 吻合（Java/Spring/微服务）；地点命中偏好',favorited:false,collectedAt:Date.now()-3600000},
  {jobId:'j-2002',title:'后端开发工程师',company:'某互联网公司',platformId:'liepin',salaryMin:18,salaryMax:30,location:'杭州',source:'search',matchScore:85,matchReason:'经验符合（2年+）；技术栈重合度高',favorited:true,collectedAt:Date.now()-7200000},
  {jobId:'j-2003',title:'软件开发工程师',company:'某创业公司',platformId:'zhaopin',salaryMin:null,salaryMax:null,location:'远程',source:'search',matchScore:79,matchReason:'远程命中偏好；薪资需确认',favorited:false,collectedAt:Date.now()-10800000},
  {jobId:'j-2004',title:'Go 后端开发',company:'某电商',platformId:'lagou',salaryMin:20,salaryMax:35,location:'北京',source:'search',matchScore:54,matchReason:'语言不符（主栈 Go，你主栈 Java）',favorited:false,collectedAt:Date.now()-14400000},
];
let curPage=1, pageSize=10, filtered=jobs.slice();

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

function render(){
  const box=document.getElementById('list');
  const totalEl=document.getElementById('total');
  totalEl.textContent=`共 ${filtered.length} 个岗位`;
  if(filtered.length===0){ box.innerHTML=`<div class="empty">没有匹配的岗位。<br>试试放宽筛选条件，或去「简历工作台」更新偏好。</div>`; document.getElementById('pager').innerHTML=''; return; }
  box.innerHTML='';
  filtered.forEach(j=>{
    const b=band(j.matchScore); const st=bandStyle(b);
    const scoreTxt = j.matchScore==null?'—':j.matchScore;
    const card=document.createElement('div'); card.className='card'+(j._ignored?' ignored':'');
    const favBadge = j.favorited?'<span class="badge badge-success">已收藏</span>':(j._ignored?'<span class="badge badge-neutral">已忽略</span>':'');
    const favBtn = j._ignored?`<button class="btn btn-secondary btn-sm" onclick="undoIgnore('${j.jobId}')">撤销忽略</button>`:(j.favorited?'<button class="btn btn-secondary btn-sm" onclick="fav(\''+j.jobId+'\',\'remove\')">取消收藏</button>':'<button class="btn btn-primary btn-sm" onclick="fav(\''+j.jobId+'\',\'favorite\')">收藏 →</button>');
    card.innerHTML=`
      <div class="job">
        <div class="match" style="background:${st.bg};border-color:${st.bd};color:${st.fg}">${scoreTxt}<small>匹配</small></div>
        <div class="info">
          <div class="title">${j.title} ${favBadge}</div>
          <div class="meta">${j.company} · ${PLAT[j.platformId]} · ${j.location} · ${j.salaryMin?j.salaryMin+'-'+j.salaryMax+'K':'薪资面议'} · ${j.source==='detail'?'详情采集':'搜索采集'}</div>
          <div class="why">匹配理由：<b>${j.matchReason||'—'}</b></div>
        </div>
        <div class="acts">
          ${favBtn}
          ${j._ignored?'':`<button class="btn btn-ghost btn-sm" onclick="fav('${j.jobId}','ignore')">忽略</button>`}
          <button class="btn btn-ghost btn-sm" onclick="toast('打开岗位详情（mock）')">详情</button>
        </div>
      </div>`;
    box.appendChild(card);
  });
  document.getElementById('pager').innerHTML=`<span>第 ${curPage} 页</span><button class="btn btn-secondary btn-sm" ${curPage<=1?'disabled':''} onclick="prev()">上一页</button><button class="btn btn-secondary btn-sm" onclick="next()">下一页</button>`;
}

// A08 收藏 / 忽略（action: favorite|ignore；removed 为取消收藏）
function fav(id,action){
  const j=jobs.find(x=>x.jobId===id); if(!j) return;
  if(action==='favorite'){ j.favorited=true; j._ignored=false; toast('已收藏，已送入「待确认投递」'); }
  else if(action==='ignore'){ j._ignored=true; j.favorited=false; toast('已忽略，不再推送该岗位'); }
  else if(action==='remove'){ j.favorited=false; toast('已取消收藏'); }
  render();
}
function undoIgnore(id){ const j=jobs.find(x=>x.jobId===id); if(j){ j._ignored=false; render(); toast('已撤销忽略'); } }

// A07 搜索 / 筛选
function doSearch(){
  const kw=document.getElementById('kw').value.trim().toLowerCase();
  const loc=document.getElementById('loc').value.trim().toLowerCase();
  const salRaw=document.getElementById('sal').value.trim();
  const salMin=salRaw?parseInt(salRaw)*1000:null;
  const pl=document.querySelector('.chip.on')?.dataset.pl||'';
  curPage=1;
  filtered=jobs.filter(j=>
    (!kw || (j.title+j.company).toLowerCase().includes(kw)) &&
    (!loc || (j.location||'').toLowerCase().includes(loc)) &&
    (!pl || j.platformId===pl) &&
    (salMin==null || (j.salaryMin||0)>=salMin)
  );
  render();
  toast(`筛选完成：命中 ${filtered.length} 个`);
}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); c.classList.add('on'); doSearch();
}));
function prev(){ if(curPage>1){curPage--;render();} }
function next(){ curPage++; render(); }

document.getElementById('nav').addEventListener('click', e=>{
  const a=e.target.closest('a'); if(!a) return; e.preventDefault();
  document.querySelectorAll('#nav a').forEach(x=>x.classList.remove('active'));
  a.classList.add('active');
  if(a.dataset.page!=='jobs') toast('该页面交互原型在对应 U 阶段交付（mock 导航）');
});

render();
</script>
</body>
</html>
