<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>U10 用户与登录 · 简历投递助手</title>
<style>
  :root{
    --c-bg:#f5f7fa; --c-surface:#fff; --c-text:#1f2733; --c-muted:#6b7785; --c-faint:#9aa6b2;
    --c-border:#e6eaf0; --c-accent:#2f6bff; --c-accent-weak:#eaf1ff; --c-ok:#22a06b;
    --r-lg:14px; --r-md:10px; --r-full:999px; --sp-2:16px; --sp-3:24px;
    --d-base:200ms; --e-out:cubic-bezier(.2,.7,.3,1);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);background:var(--c-bg);color:var(--c-text);font-size:15px}
  .page{max-width:480px;margin:0 auto;padding:var(--sp-3) var(--sp-2) 60px}
  .hero{text-align:center;padding:24px 0 8px}
  .hero .logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--c-accent),#7aa2ff);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:700}
  .hero h1{font-size:20px;margin:0 0 6px}
  .hero p{color:var(--c-muted);font-size:14px;margin:0}
  .card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-lg);padding:20px;box-shadow:0 1px 3px rgba(20,30,50,.05)}
  .tabs{display:flex;gap:6px;background:var(--c-bg);border-radius:var(--r-md);padding:4px;margin-bottom:16px}
  .tab{flex:1;text-align:center;padding:9px;border-radius:var(--r-sm);font-size:13px;cursor:pointer;color:var(--c-muted);min-height:38px}
  .tab.active{background:var(--c-surface);color:var(--c-accent);font-weight:600;box-shadow:0 1px 2px rgba(20,30,50,.08)}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:13px;color:var(--c-muted);margin-bottom:6px}
  .fld input{width:100%;border:1px solid var(--c-border);border-radius:var(--r-md);padding:11px 12px;font-size:15px;min-height:44px}
  .row{display:flex;gap:10px}
  .row .fld{flex:1}
  .codebtn{border:1px solid var(--c-border);background:var(--c-surface);border-radius:var(--r-md);padding:0 14px;font-size:13px;color:var(--c-accent);cursor:pointer;white-space:nowrap;min-height:44px}
  .codebtn:disabled{color:var(--c-faint)}
  .btn{width:100%;border:none;background:var(--c-accent);color:#fff;border-radius:var(--r-md);padding:13px;font-size:15px;font-weight:600;cursor:pointer;min-height:46px;margin-top:6px}
  .btn:active{transform:translateY(1px)}
  .hint{font-size:12px;color:var(--c-faint);margin-top:10px;text-align:center}
  .err{color:var(--c-bad);font-size:13px;margin-top:8px;min-height:18px}
  .qr{width:140px;height:140px;border:1px solid var(--c-border);border-radius:var(--r-md);margin:14px auto;display:flex;align-items:center;justify-content:center;color:var(--c-faint);font-size:13px;background:repeating-linear-gradient(45deg,#fafbfd,#fafbfd 8px,#f0f3f8 8px,#f0f3f8 16px)}
  .acct{display:none}
  .plan{display:flex;align-items:center;justify-content:space-between;background:var(--c-accent-weak);border-radius:var(--r-md);padding:14px;margin-bottom:14px}
  .plan .p{font-weight:700;color:var(--c-accent)}
  .plan .tag{font-size:12px;background:var(--c-accent);color:#fff;border-radius:var(--r-full);padding:2px 10px}
  .quota{margin-bottom:14px}
  .quota .top{display:flex;justify-content:space-between;font-size:13px;color:var(--c-muted);margin-bottom:6px}
  .track{height:10px;background:var(--c-bg);border-radius:var(--r-full);overflow:hidden}
  .fill{height:100%;background:var(--c-accent);border-radius:var(--r-full)}
  .entry{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--c-border);font-size:14px;cursor:pointer}
  .sec-t{display:flex;justify-content:space-between;margin:18px 0 8px;font-size:13px;color:var(--c-faint)}
  .switch{display:inline-block;width:46px;height:26px;border-radius:var(--r-full);background:var(--c-ok);position:relative}
  .switch .kn{position:absolute;top:3px;right:3px;width:20px;height:20px;background:#fff;border-radius:50%}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#1f2733;color:#fff;padding:11px 18px;border-radius:var(--r-full);transition:all var(--d-base) var(--e-out);z-index:20}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:480px){.page{padding:16px 14px 56px}}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="page">
  <!-- 登录引导页（未登录态） -->
  <div id="loginView">
    <div class="hero">
      <div class="logo">投</div>
      <h1>简历投递助手</h1>
      <p>AI 匹配岗位 · 半自动投递 · 每日日报</p>
    </div>
    <div class="card">
      <div class="tabs" id="ltabs">
        <div class="tab active" data-ch="email">邮箱密码</div>
        <div class="tab" data-ch="sms">邮箱验证码</div>
        <div class="tab" data-ch="wechat">微信扫码</div>
      </div>
      <div id="emailForm">
        <div class="fld"><label>邮箱</label><input id="email" type="email" placeholder="you@example.com"></div>
        <div class="fld"><label>密码</label><input id="pwd" type="password" placeholder="••••••••"></div>
      </div>
      <div id="smsForm" style="display:none">
        <div class="fld"><label>邮箱</label><input id="email2" type="email" placeholder="you@example.com"></div>
        <div class="fld"><label>验证码</label><div class="row"><input id="code" placeholder="6 位验证码"><button class="codebtn" id="sendCode">发送验证码</button></div></div>
      </div>
      <div id="wechatForm" style="display:none;text-align:center">
        <div class="qr">微信扫码登录</div>
        <div class="hint">扫码超时或失败将自动回退到邮箱登录</div>
      </div>
      <div class="err" id="err" aria-live="polite"></div>
      <button class="btn" id="loginBtn">登录</button>
      <div class="hint">未登录时仅展示本引导页，不暴露任何业务数据</div>
    </div>
  </div>

  <!-- 账户与权益（已登录态预览） -->
  <div id="acctView" class="acct">
    <div class="card">
      <div class="plan"><div><div class="p" id="planName">专业版 pro</div><div style="font-size:12px;color:var(--c-muted)">解锁 100 份/天 · 多平台</div></div><span class="tag">当前套餐</span></div>
      <div class="quota">
        <div class="top"><span>今日套餐额度</span><span id="quotaTxt">32 / 100</span></div>
        <div class="track"><div class="fill" id="quotaFill" style="width:32%"></div></div>
      </div>
      <div class="entry">邮箱 <span style="color:var(--c-muted)" id="emailTxt">you@example.com</span></div>
      <div class="entry">推送偏好（A25） <span style="color:var(--c-accent)">›</span></div>
      <div class="entry">投递策略（A12/A13） <span style="color:var(--c-accent)">›</span></div>
      <div class="entry">本机 Agent 登录态（Cookie 仅存本机） <span class="switch"><span class="kn"></span></span></div>
      <div class="sec-t"><span>登出</span><span id="logout" style="color:var(--c-bad);cursor:pointer">退出并清除本机凭据 ›</span></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// 设备标识（本机 Agent 绑定，mock）
const deviceId = 'dev-' + Math.random().toString(36).slice(2,10);
let channel='email';
document.getElementById('ltabs').addEventListener('click',e=>{
  if(!e.target.classList.contains('tab'))return;
  document.querySelectorAll('#ltabs .tab').forEach(t=>t.classList.remove('active'));e.target.classList.add('active');
  channel=e.target.dataset.ch;
  document.getElementById('emailForm').style.display = channel==='email'?'block':'none';
  document.getElementById('smsForm').style.display = channel==='sms'?'block':'none';
  document.getElementById('wechatForm').style.display = channel==='wechat'?'block':'none';
  document.getElementById('err').textContent='';
});
let cd=null;
document.getElementById('sendCode').onclick=function(){if(cd)return;let n=60;this.disabled=true;this.textContent=n+'s';cd=setInterval(()=>{n--;this.textContent=n+'s';if(n<=0){clearInterval(cd);cd=null;this.disabled=false;this.textContent='发送验证码';}},1000);toast('验证码已发送（演示）');};
document.getElementById('loginBtn').onclick=()=>{
  const err=document.getElementById('err');err.textContent='';
  if(channel==='email'){const e=email.value,p=pwd.value;if(!e||!p){err.textContent='请输入邮箱与密码';return;}}
  if(channel==='sms'){const e=email2.value,c=code.value;if(!e||!c||c.length<6){err.textContent='请输入邮箱与 6 位验证码';return;}}
  if(channel==='wechat'){err.textContent='微信扫码演示失败，已回退邮箱登录';switchChannel('email');return;}
  // 模拟 A01 返回双令牌（本地存，仅本机；不触真实凭据）
  toast('登录成功（模拟 A01，双令牌已存本机）');
  setTimeout(()=>{document.getElementById('loginView').style.display='none';document.getElementById('acctView').style.display='block';},700);
};
function switchChannel(ch){channel=ch;document.querySelectorAll('#ltabs .tab').forEach(t=>t.classList.toggle('active',t.dataset.ch===ch));
  document.getElementById('emailForm').style.display=ch==='email'?'block':'none';document.getElementById('smsForm').style.display=ch==='sms'?'block':'none';document.getElementById('wechatForm').style.display=ch==='wechat'?'block':'none';}
document.getElementById('logout').onclick=()=>{toast('已清除本机令牌与 Agent Cookie（演示）');document.getElementById('acctView').style.display='none';document.getElementById('loginView').style.display='block';};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
</script>
</body>
</html>
