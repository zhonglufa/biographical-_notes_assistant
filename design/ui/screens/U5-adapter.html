<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平台管理 · U5 适配器管理（mock 原型）</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --ink:#1f2733; --muted:#6b7686; --line:#e6e9ef;
    --accent:#6c5ce7; --green:#16a34a; --red:#dc2626; --yellow:#d97706; --gray:#9aa3b2; --blue:#2563eb;
    --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  .shell{max-width:980px;margin:0 auto;padding:24px 20px 60px}
  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  header.top h1{font-size:22px;margin:0}
  .health-summary{font-size:13px;color:var(--muted)}
  .health-summary b{color:var(--green)}
  section.block{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:18px}
  section.block h2{font-size:15px;margin:0 0 12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
  .card{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;transition:box-shadow .2s}
  .card:hover{box-shadow:var(--shadow)}
  .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .dot::after{content:attr(data-label);margin-left:16px;font-size:12px;color:var(--muted)}
  .meta{flex:1;min-width:0}
  .meta .name{font-weight:600}
  .meta .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .health{font-size:12px;color:var(--muted);text-align:right;min-width:120px}
  .actions{display:flex;gap:8px}
  button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;border-radius:9px;cursor:pointer;transition:transform .12s,background .15s}
  button:hover{background:#f0f2f6}
  button:active{transform:scale(.97)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{border-color:#f3c9c9;color:var(--red)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .placeholder{color:var(--gray);font-size:13px;padding:14px;border:1px dashed var(--line);border-radius:10px;text-align:center}
  /* modal */
  .mask{position:fixed;inset:0;background:rgba(16,24,40,.4);display:none;align-items:center;justify-content:center;z-index:50}
  .mask.show{display:flex}
  .dialog{background:#fff;border-radius:16px;padding:22px;width:360px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .dialog h3{margin:0 0 8px}
  .dialog p{color:var(--muted);font-size:14px;margin:0 0 16px}
  .dialog .row{display:flex;gap:10px;justify-content:flex-end}
  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);background:#1f2733;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:opacity .2s,transform .2s;z-index:60;font-size:14px;display:flex;gap:14px;align-items:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast button{background:transparent;border:none;color:#9ad;cursor:pointer;padding:0}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>平台管理</h1>
    <div class="health-summary">适配器健康：<b id="okCount">4</b> / 5 正常</div>
  </header>

  <section class="block">
    <h2>首期</h2>
    <div id="list"></div>
  </section>

  <section class="block">
    <h2>后续（未安装）</h2>
    <div class="placeholder">国聘网 · 牛客网 · 高校就业平台 … &nbsp;「安装适配器」入口为 v2 范围（本包仅占位）</div>
  </section>
</div>

<!-- 二次确认闸门（复用 U3 模式） -->
<div class="mask" id="mask">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h3 id="dlgTitle">确认操作</h3>
    <p id="dlgBody"></p>
    <div class="row">
      <button id="dlgCancel">取消</button>
      <button id="dlgOk" class="primary">确认</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="undoBtn" style="display:none">撤销</button></div>

<script>
// mock 数据（对应 A14 + adapter-facade + b09-health）
const DOTS={installed:{c:'var(--gray)',t:'已安装'},test_mode:{c:'var(--blue)',t:'测试中'},enabled:{c:'var(--green)',t:'正常'},disabled:{c:'var(--gray)',t:'已停用'},degraded:{c:'var(--red)',t:'异常'},login_expired:{c:'var(--yellow)',t:'需登录'}};
const adapters=[
  {id:'boss',name:'BOSS直聘',type:'社招',ver:'v1.2.0',status:'enabled',healthy:true,cookie:true,checked:'2 分钟前',pro:true},
  {id:'liepin',name:'猎聘',type:'社招/中高端',ver:'v1.1.0',status:'enabled',healthy:true,cookie:true,checked:'1 分钟前',pro:true},
  {id:'job51',name:'前程无忧',type:'综合',ver:'v1.0.3',status:'degraded',healthy:false,cookie:true,checked:'5 分钟前',pro:true},
  {id:'zhaopin',name:'智联招聘',type:'综合',ver:'v1.0.1',status:'login_expired',healthy:true,cookie:false,checked:'8 分钟前',pro:false},
  {id:'lagou',name:'拉勾',type:'互联网',ver:'v0.9.0',status:'disabled',healthy:true,cookie:true,checked:'12 分钟前',pro:true},
];
let undoTimer=null, pending=null;
const list=document.getElementById('list');
function render(){
  list.innerHTML='';
  let ok=0;
  adapters.forEach(a=>{
    if(a.status==='enabled'&&a.healthy) ok++;
    const d=DOTS[a.status];
    const canPro=a.pro;
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`
      <span class="dot" style="background:${d.c}" data-label="${d.t}"></span>
      <div class="meta"><div class="name">${a.name} <span style="color:var(--muted);font-weight:400;font-size:12px">${a.ver}</span></div>
      <div class="sub">${a.type} · 作者 community</div></div>
      <div class="health">健康 ${a.healthy?'✓':'✗'} · Cookie ${a.cookie?'✓':'✗'}<br>检查 ${a.checked}</div>
      <div class="actions">
        ${(a.status==='login_expired')?`<button onclick="guide('${a.id}')">登录</button>`:''}
        ${(a.status==='enabled'||a.status==='test_mode')?`<button class="danger" onclick="confirmToggle('${a.id}',false)">停用</button>`:`<button class="primary" ${canPro?'':'disabled'} onclick="confirmToggle('${a.id}',true)" title="${canPro?'':'仅专业版可用'}">启用</button>`}
      </div>`;
    list.appendChild(card);
  });
  document.getElementById('okCount').textContent=ok;
}
function confirmToggle(id,enable){
  const a=adapters.find(x=>x.id===id);
  const mask=document.getElementById('mask');
  document.getElementById('dlgTitle').textContent=enable?'启用适配器':'停用适配器';
  document.getElementById('dlgBody').textContent=`确认将「${a.name}」${enable?'启用（将参与投递调度）':'停用（不再参与投递调度）'}？`;
  pending={id,enable}; mask.classList.add('show');
}
document.getElementById('dlgCancel').onclick=()=>document.getElementById('mask').classList.remove('show');
document.getElementById('dlgOk').onclick=()=>{
  const a=adapters.find(x=>x.id===pending.id);
  const prev=a.status; a.status=pending.enable?'enabled':'disabled';
  document.getElementById('mask').classList.remove('show');
  render();
  showToast(`${a.name} 已${pending.enable?'启用':'停用'}`,()=>{a.status=prev;render();showToast('已撤销');});
};
function guide(id){const a=adapters.find(x=>x.id===id);showToast(`「${a.name}」需重新登录：请在本机浏览器打开登录页完成登录（仅引导，不代填凭据）`);}
function showToast(msg,undo){
  const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;
  const ub=document.getElementById('undoBtn');
  if(undo){ub.style.display='';ub.onclick=()=>{clearTimeout(undoTimer);undo();t.classList.remove('show');};}
  else ub.style.display='none';
  t.classList.add('show');clearTimeout(undoTimer);
  if(undo)undoTimer=setTimeout(()=>t.classList.remove('show'),10000);
  else setTimeout(()=>t.classList.remove('show'),2600);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('mask').classList.remove('show');});
render();
</script>
</body>
</html>
