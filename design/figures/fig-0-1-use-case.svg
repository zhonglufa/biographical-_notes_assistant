<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1000" height="720" fill="#ffffff"/>

  <!-- ========== 标题区 ========== -->
  <text x="30" y="38" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#1f2937">图 0-1 用例图</text>
  <text x="30" y="56" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" fill="#9ca3af">UML 2.5 Use Case Diagram · 展示系统功能边界与参与者关系 · 需求分析阶段核心图</text>

  <!-- ========== 系统边界 ========== -->
  <rect x="220" y="80" width="560" height="550" rx="10" fill="none" stroke="#1a73e8" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="500" y="105" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="bold" fill="#1a73e8" text-anchor="middle">简历自动投递与面试模拟系统</text>

  <!-- ========== 参与者（左：求职者） ========== -->
  <!-- 求职者头部 -->
  <circle cx="100" cy="280" r="18" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <!-- 身体 -->
  <line x1="100" y1="298" x2="100" y2="340" stroke="#eab308" stroke-width="2" stroke-linecap="round"/>
  <!-- 左臂 -->
  <line x1="100" y1="310" x2="80" y2="330" stroke="#eab308" stroke-width="2" stroke-linecap="round"/>
  <!-- 右臂 -->
  <line x1="100" y1="310" x2="120" y2="330" stroke="#eab308" stroke-width="2" stroke-linecap="round"/>
  <!-- 左腿 -->
  <line x1="100" y1="340" x2="82" y2="370" stroke="#eab308" stroke-width="2" stroke-linecap="round"/>
  <!-- 右腿 -->
  <line x1="100" y1="340" x2="118" y2="370" stroke="#eab308" stroke-width="2" stroke-linecap="round"/>
  <text x="100" y="395" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">求职者</text>
  <text x="100" y="412" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">主要参与者</text>

  <!-- ========== 参与者（右：外部系统） ========== -->
  <!-- 招聘平台 -->
  <rect x="850" y="200" width="120" height="50" rx="6" fill="#f8f9fa" stroke="#9ca3af" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="910" y="228" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">招聘平台</text>
  <text x="910" y="242" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">外部系统</text>

  <!-- AI匹配服务 -->
  <rect x="850" y="340" width="120" height="50" rx="6" fill="#f8f9fa" stroke="#9ca3af" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="910" y="368" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">AI匹配服务</text>
  <text x="910" y="382" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">外部系统</text>

  <!-- 推送服务 -->
  <rect x="850" y="480" width="120" height="50" rx="6" fill="#f8f9fa" stroke="#9ca3af" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="910" y="508" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">推送服务</text>
  <text x="910" y="522" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">外部系统</text>

  <!-- ========== 用例（左列） ========== -->
  <!-- 用例1：上传/编辑简历 -->
  <ellipse cx="370" cy="150" rx="75" ry="22" fill="#e8f4fd" stroke="#1a73e8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="154" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">上传/编辑简历</text>

  <!-- 用例2：浏览岗位 -->
  <ellipse cx="370" cy="230" rx="65" ry="22" fill="#e8f4fd" stroke="#1a73e8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="234" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">浏览岗位</text>

  <!-- 用例3：确认投递 -->
  <ellipse cx="370" cy="310" rx="65" ry="22" fill="#e8f4fd" stroke="#1a73e8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="314" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">确认投递</text>

  <!-- 用例4：配置投递策略 -->
  <ellipse cx="370" cy="390" rx="75" ry="22" fill="#e8f4fd" stroke="#1a73e8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="394" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">配置投递策略</text>

  <!-- 用例5：模拟面试 -->
  <ellipse cx="370" cy="470" rx="65" ry="22" fill="#e8f4fd" stroke="#1a73e8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="474" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">模拟面试</text>

  <!-- 用例6：查看日报 -->
  <ellipse cx="370" cy="550" rx="65" ry="22" fill="#e8f4fd" stroke="#1a73e8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="554" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">查看日报</text>

  <!-- ========== 用例（右列） ========== -->
  <!-- 用例7：查看投递状态 -->
  <ellipse cx="630" cy="150" rx="75" ry="22" fill="#e8f4fd" stroke="#1a73e8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="630" y="154" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">查看投递状态</text>

  <!-- 用例8：查看AI匹配报告 -->
  <ellipse cx="630" cy="230" rx="80" ry="22" fill="#e8f4fd" stroke="#1a73e8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="630" y="234" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">查看AI匹配报告</text>

  <!-- 用例9：管理通知 -->
  <ellipse cx="630" cy="310" rx="65" ry="22" fill="#e8f4fd" stroke="#1a73e8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="630" y="314" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">管理通知</text>

  <!-- 用例10：自动投递简历（系统内部） -->
  <ellipse cx="630" cy="390" rx="75" ry="22" fill="#e0f2e9" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#shadow)"/>
  <text x="630" y="394" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">自动投递简历</text>

  <!-- 用例11：自动跟踪状态 -->
  <ellipse cx="630" cy="470" rx="75" ry="22" fill="#e0f2e9" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#shadow)"/>
  <text x="630" y="474" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">自动跟踪状态</text>

  <!-- 用例12：自动匹配分析 -->
  <ellipse cx="630" cy="550" rx="75" ry="22" fill="#e0f2e9" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#shadow)"/>
  <text x="630" y="554" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">自动匹配分析</text>

  <!-- ========== 关联线：求职者 → 用例 ========== -->
  <line x1="118" y1="310" x2="295" y2="150" stroke="#64748b" stroke-width="1.2"/>
  <line x1="118" y1="320" x2="305" y2="230" stroke="#64748b" stroke-width="1.2"/>
  <line x1="118" y1="330" x2="305" y2="310" stroke="#64748b" stroke-width="1.2"/>
  <line x1="118" y1="335" x2="295" y2="390" stroke="#64748b" stroke-width="1.2"/>
  <line x1="118" y1="340" x2="305" y2="470" stroke="#64748b" stroke-width="1.2"/>
  <line x1="118" y1="345" x2="305" y2="550" stroke="#64748b" stroke-width="1.2"/>

  <line x1="118" y1="315" x2="555" y2="150" stroke="#64748b" stroke-width="1.2"/>
  <line x1="118" y1="325" x2="550" y2="230" stroke="#64748b" stroke-width="1.2"/>
  <line x1="118" y1="332" x2="565" y2="310" stroke="#64748b" stroke-width="1.2"/>

  <!-- ========== 关联线：外部系统 → 用例 ========== -->
  <!-- 招聘平台 → 自动投递简历 -->
  <line x1="850" y1="225" x2="705" y2="390" stroke="#64748b" stroke-width="1.2"/>
  <!-- 招聘平台 → 自动跟踪状态 -->
  <line x1="850" y1="225" x2="705" y2="470" stroke="#64748b" stroke-width="1.2"/>

  <!-- AI匹配服务 → 自动匹配分析 -->
  <line x1="850" y1="365" x2="705" y2="550" stroke="#64748b" stroke-width="1.2"/>
  <!-- AI匹配服务 → 查看AI匹配报告 -->
  <line x1="850" y1="365" x2="710" y2="230" stroke="#64748b" stroke-width="1.2"/>

  <!-- 推送服务 → 管理通知 -->
  <line x1="850" y1="505" x2="695" y2="310" stroke="#64748b" stroke-width="1.2"/>

  <!-- ========== include 关系（虚线箭头） ========== -->
  <!-- 确认投递 ←include← 自动投递简历 -->
  <path d="M 435 310 L 530 370" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="470" y="336" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" fill="#059669" text-anchor="middle" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- 查看投递状态 ←include← 自动跟踪状态 -->
  <path d="M 555 160 L 540 440" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="550" y="300" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" fill="#059669" text-anchor="middle" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- 查看AI匹配报告 ←include← 自动匹配分析 -->
  <path d="M 555 240 L 555 520" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="560" y="380" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" fill="#059669" text-anchor="middle" font-style="italic">&lt;&lt;include&gt;&gt;</text>

  <!-- ========== 图例区 ========== -->
  <rect x="30" y="640" width="940" height="45" rx="8" fill="#f8f9fa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="50" y="660" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="bold" fill="#1f2937">图例</text>

  <ellipse cx="150" cy="658" rx="20" ry="10" fill="#e8f4fd" stroke="#1a73e8" stroke-width="1"/>
  <text x="178" y="662" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10" fill="#1f2937">用户用例（手动操作）</text>

  <ellipse cx="370" cy="658" rx="20" ry="10" fill="#e0f2e9" stroke="#059669" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="398" y="662" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10" fill="#1f2937">系统用例（自动执行，虚线边框）</text>

  <line x1="600" y1="658" x2="625" y2="658" stroke="#059669" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="635" y="662" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10" fill="#1f2937">&lt;&lt;include&gt;&gt; 包含关系</text>

  <rect x="810" y="650" width="16" height="16" rx="3" fill="#f8f9fa" stroke="#9ca3af" stroke-width="1"/>
  <text x="832" y="662" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10" fill="#1f2937">外部系统</text>

  <!-- ========== 元数据 ========== -->
  <text x="30" y="710" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" fill="#9ca3af">作者: Trae | 创建: 2026-08-14 | 版本: v1.0 | 遵循标准: UML 2.5 · 作图大全标准 v1.3 §7.1</text>
</svg>