<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="985" viewBox="0 0 1500 985" style="background:#ffffff;font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif">
  <!--
    fig-2-3-deployment.svg v2.0 (2026-08-15)
    修复: ① OSS 琥珀 #E8A317 → 数据存储绿 #22C55E（对齐通用规范色板）
         ② 浏览器客户端移入画布（x≥30），连接线正交布线 0 交叉 0 穿盒
         ③ 图例移至数据层 3D 底下方 ≥40px，与主图元素不重叠
         ④ 数据层 4 节点间距 ≥60px（部署节点规范），全部线终点落在容器外边框
    环境标识 #DC2626 12px Bold：符合作图-06-部署图规范 §3.5.5
  -->
  <defs>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- ==================== 标题 ==================== -->
  <text x="750" y="34" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#333333">图 2-3 部署架构图</text>
  <text x="750" y="54" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#666666">模块化单体 · 单机起步，浏览器自动化下沉至用户本机 Agent（ADR-001/002）</text>
  <text x="1464" y="34" text-anchor="end" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" font-weight="bold" fill="#DC2626">环境: prod</text>

  <!-- ==================== 用户侧浏览器客户端 ==================== -->
  <rect x="30" y="170" width="70" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="65" y="196" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" fill="#333333">浏览器客户端</text>

  <!-- ==================== 入口层：Nginx ==================== -->
  <path d="M 140 100 L 390 100 L 420 130 L 420 280 L 140 280 Z" fill="#E2E8F0"/>
  <path d="M 140 280 L 170 310 L 420 310 L 390 280 Z" fill="#CBD5E1" fill-opacity="0.85"/>
  <rect x="140" y="100" width="250" height="150" fill="#F8F9FA" stroke="#94A3B8" stroke-width="1"/>
  <text x="265" y="122" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#333333">Nginx 入口</text>
  <rect x="160" y="132" width="210" height="100" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="265" y="154" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" fill="#1A73E8" font-weight="bold">Web / H5 网关</text>
  <text x="265" y="174" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">TLS 终止 · 反向代理</text>
  <text x="265" y="192" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">H5 静态 → OSS</text>

  <!-- ==================== 应用层 Host（同机双进程） ==================== -->
  <path d="M 140 340 L 680 340 L 710 370 L 710 590 L 140 590 Z" fill="#E2E8F0"/>
  <path d="M 140 590 L 170 620 L 710 620 L 680 590 Z" fill="#CBD5E1" fill-opacity="0.85"/>
  <rect x="140" y="340" width="540" height="220" fill="#F8F9FA" stroke="#94A3B8" stroke-width="1"/>
  <text x="405" y="364" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#333333">应用宿主机 Host（同机双进程）</text>

  <!-- Java 部署单元 -->
  <rect x="150" y="378" width="240" height="150" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="270" y="400" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" font-weight="bold" fill="#1A73E8">Java 业务服务</text>
  <text x="270" y="418" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">Spring Boot 3.x</text>
  <text x="270" y="436" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">事务 · 状态机 · 支付</text>
  <text x="270" y="454" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">业务数据</text>

  <!-- Python 部署单元 -->
  <rect x="430" y="378" width="240" height="150" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="550" y="400" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" font-weight="bold" fill="#1A73E8">Python LLM 网关</text>
  <text x="550" y="418" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">FastAPI</text>
  <text x="550" y="436" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">LLM 编排 · 匹配打分</text>
  <text x="550" y="454" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">不直连业务库</text>

  <!-- Host 内部总线说明 -->
  <text x="405" y="546" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="9" fill="#666666">内部总线 REST:8000 / 事件（Java ↔ Python）</text>

  <!-- ==================== 本机 Agent（用户侧） ==================== -->
  <path d="M 980 340 L 1300 340 L 1330 370 L 1330 590 L 980 590 Z" fill="#E2E8F0"/>
  <path d="M 980 590 L 1010 620 L 1330 620 L 1300 590 Z" fill="#CBD5E1" fill-opacity="0.85"/>
  <rect x="980" y="340" width="320" height="220" fill="#F8F9FA" stroke="#94A3B8" stroke-width="1"/>
  <text x="1140" y="364" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#333333">本机 Agent（用户侧）</text>
  <rect x="1002" y="378" width="276" height="150" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="1140" y="400" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" font-weight="bold" fill="#1A73E8">浏览器自动化执行器</text>
  <text x="1140" y="420" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">Playwright · 浏览器实例池 ≤3</text>
  <text x="1140" y="438" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">住宅/移动代理 IP</text>
  <text x="1140" y="456" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">本地队列 SQLite 降级</text>
  <text x="1140" y="474" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="9" fill="#9CA3AF">每用户 1 节点 · 服务端无浏览器算力</text>

  <!-- ==================== 数据层（Host 内 + 云服务） ==================== -->
  <!-- Redis（Host 内） -->
  <path d="M 140 650 L 370 650 L 400 680 L 400 840 L 140 840 Z" fill="#E2E8F0"/>
  <path d="M 140 840 L 170 870 L 400 870 L 370 840 Z" fill="#CBD5E1" fill-opacity="0.85"/>
  <rect x="140" y="650" width="230" height="160" fill="#F8F9FA" stroke="#94A3B8" stroke-width="1"/>
  <text x="255" y="672" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#333333">Redis 7（Host 内）</text>
  <rect x="156" y="684" width="198" height="106" fill="none" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="255" y="706" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" fill="#1A73E8" font-weight="bold">缓存 · 分布式锁</text>
  <text x="255" y="724" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">幂等令牌 · Java/Python 共享</text>
  <text x="255" y="742" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">只存可重建数据</text>

  <!-- MySQL 主从（云） -->
  <path d="M 460 650 L 690 650 L 720 680 L 720 840 L 460 840 Z" fill="#E2E8F0"/>
  <path d="M 460 840 L 490 870 L 720 870 L 690 840 Z" fill="#CBD5E1" fill-opacity="0.85"/>
  <rect x="460" y="650" width="230" height="160" fill="#F8F9FA" stroke="#94A3B8" stroke-width="1"/>
  <text x="575" y="672" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#333333">MySQL 8.0 主从（云）</text>
  <rect x="476" y="684" width="198" height="106" fill="none" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="575" y="706" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" fill="#1A73E8" font-weight="bold">业务关系数据</text>
  <text x="575" y="724" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">主从复制 · 仅 Java 直连</text>
  <text x="575" y="742" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">Python 经 REST/MQ 访问</text>

  <!-- RabbitMQ（云） -->
  <path d="M 780 650 L 1010 650 L 1040 680 L 1040 840 L 780 840 Z" fill="#E2E8F0"/>
  <path d="M 780 840 L 810 870 L 1040 870 L 1010 840 Z" fill="#CBD5E1" fill-opacity="0.85"/>
  <rect x="780" y="650" width="230" height="160" fill="#F8F9FA" stroke="#94A3B8" stroke-width="1"/>
  <text x="895" y="672" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#333333">RabbitMQ 3.13（云）</text>
  <rect x="796" y="684" width="198" height="106" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="895" y="706" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" fill="#1A73E8" font-weight="bold">异步消息总线</text>
  <text x="895" y="724" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">投递/对账任务 · 事件</text>
  <text x="895" y="742" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">延迟队列 · 死信</text>

  <!-- OSS（云） -->
  <path d="M 1100 650 L 1330 650 L 1360 680 L 1360 840 L 1100 840 Z" fill="#E2E8F0"/>
  <path d="M 1100 840 L 1130 870 L 1360 870 L 1330 840 Z" fill="#CBD5E1" fill-opacity="0.85"/>
  <rect x="1100" y="650" width="230" height="160" fill="#F8F9FA" stroke="#94A3B8" stroke-width="1"/>
  <text x="1215" y="672" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#333333">OSS（云）</text>
  <rect x="1116" y="684" width="198" height="106" fill="none" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="1215" y="706" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" fill="#1A73E8" font-weight="bold">对象存储</text>
  <text x="1215" y="724" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">简历导出 · 证据快照</text>
  <text x="1215" y="742" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">S3 协议 · Python 直连</text>

  <!-- ==================== 连接线（正交布线，0 交叉 0 穿盒） ==================== -->
  <!-- ① 浏览器 → Nginx -->
  <line x1="100" y1="192" x2="140" y2="192" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <rect x="96" y="180" width="48" height="13" rx="3" fill="#FFFFFF"/>
  <text x="120" y="190" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">HTTPS:443</text>

  <!-- ② Nginx → Java（反向代理下行） -->
  <line x1="270" y1="250" x2="270" y2="378" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <rect x="276" y="306" width="56" height="13" rx="3" fill="#FFFFFF"/>
  <text x="304" y="316" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">HTTPS:443</text>

  <!-- ③ Java → 本机 Agent（WSS 任务通道，顶部走廊 y=310） -->
  <path d="M 370 378 L 370 310 L 1140 310 L 1140 378" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <rect x="726" y="298" width="68" height="13" rx="3" fill="#FFFFFF"/>
  <text x="760" y="308" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">WSS:443</text>

  <!-- ④ Java → MySQL（垂直直连） -->
  <line x1="270" y1="528" x2="270" y2="650" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <rect x="276" y="566" width="64" height="13" rx="3" fill="#FFFFFF"/>
  <text x="308" y="576" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">JDBC:3306</text>

  <!-- ⑤ Java → Redis（水平段 y=632） -->
  <path d="M 320 528 L 320 632 L 575 632 L 575 650" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <rect x="414" y="620" width="66" height="13" rx="3" fill="#FFFFFF"/>
  <text x="447" y="630" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">Lettuce:6379</text>

  <!-- ⑥ Java → RabbitMQ（经内部总线，水平段 y=590） -->
  <path d="M 650 528 L 650 590 L 895 590 L 895 650" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <rect x="726" y="578" width="64" height="13" rx="3" fill="#FFFFFF"/>
  <text x="758" y="588" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">AMQP:5672</text>

  <!-- ⑦ Python → Redis（与 ⑤ 反向捆扎 x=575 共享段） -->
  <path d="M 585 528 L 585 560 L 575 560 L 575 650" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <rect x="591" y="532" width="66" height="13" rx="3" fill="#FFFFFF"/>
  <text x="624" y="542" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">redis-py:6379</text>

  <!-- ⑧ Python → OSS（Host 外走廊 y=570，避开 Java→RabbitMQ 入线 y=590 与数据层顶面） -->
  <path d="M 620 528 L 620 570 L 1215 570 L 1215 650" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <rect x="900" y="558" width="66" height="13" rx="3" fill="#FFFFFF"/>
  <text x="933" y="568" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">S3:443</text>

  <!-- ==================== 图例（数据层 3D 底 870 下方 42px，不重叠） ==================== -->
  <rect x="380" y="912" width="740" height="46" rx="6" fill="#F8F9FA" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="400" y="922" width="16" height="16" fill="#F8F9FA" stroke="#94A3B8" stroke-width="1"/>
  <text x="420" y="934" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">物理/虚拟节点</text>
  <rect x="530" y="922" width="16" height="16" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="550" y="934" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">部署单元</text>
  <rect x="660" y="922" width="16" height="16" fill="none" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="680" y="934" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">数据存储</text>
  <rect x="790" y="922" width="16" height="16" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="810" y="934" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">消息队列</text>
  <line x1="930" y1="930" x2="960" y2="930" stroke="#333333" stroke-width="2" marker-end="url(#arrow-sync)"/>
  <text x="966" y="934" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" fill="#333333">通信路径 协议:端口</text>

