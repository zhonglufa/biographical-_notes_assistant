<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%" style="background:#ffffff;font-family:'Microsoft YaHei','Noto Sans CJK SC','PingFang SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <!-- 同步消息箭头（实心三角形）: stroke="#333333" stroke-width="1.5" -->
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="#333333"/>
    </marker>
    <!-- 异步消息箭头（开放箭头）: stroke="#666666" stroke-width="1.5" -->
    <marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#666666" stroke-width="1.5"/>
    </marker>
    <!-- 返回消息箭头（开放箭头虚线）: stroke="#999999" stroke-width="1" -->
    <marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#999999" stroke-width="1"/>
    </marker>
  </defs>

  <!-- ========================================================== -->
  <!-- 标题区（16px Bold #333333 居中，下方留白20px） -->
  <!-- ========================================================== -->
  <text x="800" y="28" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">图 4-3 投递全生命周期时序图</text>
  <!-- 副标题：10px Regular #666666 -->
  <text x="800" y="46" font-size="10" fill="#666666" text-anchor="middle">投递全生命周期 · 验证码分支 · 断网补传</text>

  <!-- ========================================================== -->
  <!-- 组合片段背景（Z轴最底层，先于激活条绘制） -->
  <!-- ========================================================== -->

  <!-- opt 验证码检测：y=780~920，覆盖 Worker(280) ~ CaptchaLoop(1300) -->
  <rect x="220" y="780" width="1140" height="140" fill="#F0F0F0" stroke="#AAAAAA" stroke-width="0.5"/>

  <!-- opt 断网补传：y=900~1020，覆盖 LocalStore(460) ~ 服务端(1460) -->
  <rect x="400" y="900" width="1120" height="120" fill="#F0F0F0" stroke="#AAAAAA" stroke-width="0.5"/>

  <!-- ========================================================== -->
  <!-- 激活条（4px宽 #DBEAFE，在组合片段背景之上、namebox之前） -->
  <!-- ========================================================== -->
  <!-- Supervisor: y=120~126 -->
  <rect x="98" y="120" width="4" height="8" fill="#DBEAFE" stroke="#1A73E8" stroke-width="0.5"/>
  <!-- Worker: y=120~640 -->
  <rect x="278" y="120" width="4" height="520" fill="#DBEAFE" stroke="#1A73E8" stroke-width="0.5"/>
  <!-- LocalStore: y=160~980 -->
  <rect x="458" y="160" width="4" height="820" fill="#DBEAFE" stroke="#1A73E8" stroke-width="0.5"/>
  <!-- DeviceVault: y=240~280 -->
  <rect x="618" y="240" width="4" height="40" fill="#DBEAFE" stroke="#1A73E8" stroke-width="0.5"/>
  <!-- CookieVault: y=320~360 -->
  <rect x="778" y="320" width="4" height="40" fill="#DBEAFE" stroke="#1A73E8" stroke-width="0.5"/>
  <!-- BrowserPool: y=400~440 -->
  <rect x="938" y="400" width="4" height="40" fill="#DBEAFE" stroke="#1A73E8" stroke-width="0.5"/>
  <!-- BrowserInstance: y=440~640 -->
  <rect x="1118" y="440" width="4" height="200" fill="#DBEAFE" stroke="#1A73E8" stroke-width="0.5"/>
  <!-- CaptchaLoop: y=800~840 -->
  <rect x="1298" y="800" width="4" height="40" fill="#DBEAFE" stroke="#1A73E8" stroke-width="0.5"/>
  <!-- 服务端: y=720~726 -->
  <rect x="1458" y="720" width="4" height="8" fill="#DBEAFE" stroke="#1A73E8" stroke-width="0.5"/>
  <!-- 服务端: y=980~986 -->
  <rect x="1458" y="980" width="4" height="8" fill="#DBEAFE" stroke="#1A73E8" stroke-width="0.5"/>

  <!-- ========================================================== -->
  <!-- 组合片段 namebox（#F5F5F5 填充覆盖下方激活条） -->
  <!-- ========================================================== -->
  <!-- opt 验证码检测 namebox -->
  <rect x="220" y="780" width="102" height="22" rx="4" fill="#F5F5F5" stroke="#AAAAAA" stroke-width="0.5"/>
  <text x="271" y="803" font-size="11" font-weight="bold" fill="#333333" text-anchor="middle">opt 验证码检测</text>

  <!-- opt 断网补传 namebox -->
  <rect x="400" y="900" width="92" height="22" rx="4" fill="#F5F5F5" stroke="#AAAAAA" stroke-width="0.5"/>
  <text x="446" y="923" font-size="11" font-weight="bold" fill="#333333" text-anchor="middle">opt 断网补传</text>

  <!-- ========================================================== -->
  <!-- 参与者头部（y=70，宽100×高30，rx=4，纯色背景+白色文字） -->
  <!-- ========================================================== -->

  <!-- 1. Supervisor（系统组件：#1A73E8 蓝色） -->
  <rect x="50" y="70" width="100" height="30" rx="4" fill="#1A73E8" stroke="#1A73E8"/>
  <text x="100" y="90" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Supervisor</text>
  <text x="100" y="116" font-size="10" fill="#666666" text-anchor="middle">系统</text>

  <!-- 2. Worker（系统组件：#1A73E8 蓝色） -->
  <rect x="230" y="70" width="100" height="30" rx="4" fill="#1A73E8" stroke="#1A73E8"/>
  <text x="280" y="90" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Worker</text>
  <text x="280" y="116" font-size="10" fill="#666666" text-anchor="middle">系统</text>

  <!-- 3. LocalStore（系统组件：#1A73E8 蓝色） -->
  <rect x="410" y="70" width="100" height="30" rx="4" fill="#1A73E8" stroke="#1A73E8"/>
  <text x="460" y="90" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LocalStore</text>
  <text x="460" y="116" font-size="10" fill="#666666" text-anchor="middle">系统</text>

  <!-- 4. DeviceVault（系统组件：#1A73E8 蓝色） -->
  <rect x="570" y="70" width="100" height="30" rx="4" fill="#1A73E8" stroke="#1A73E8"/>
  <text x="620" y="90" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DeviceVault</text>
  <text x="620" y="116" font-size="10" fill="#666666" text-anchor="middle">系统</text>

  <!-- 5. CookieVault（系统组件：#1A73E8 蓝色） -->
  <rect x="730" y="70" width="100" height="30" rx="4" fill="#1A73E8" stroke="#1A73E8"/>
  <text x="780" y="90" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CookieVault</text>
  <text x="780" y="116" font-size="10" fill="#666666" text-anchor="middle">系统</text>

  <!-- 6. BrowserPool（系统组件：#1A73E8 蓝色） -->
  <rect x="890" y="70" width="100" height="30" rx="4" fill="#1A73E8" stroke="#1A73E8"/>
  <text x="940" y="90" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BrowserPool</text>
  <text x="940" y="116" font-size="10" fill="#666666" text-anchor="middle">系统</text>

  <!-- 7. BrowserInstance（系统组件：#1A73E8 蓝色） -->
  <rect x="1070" y="70" width="100" height="30" rx="4" fill="#1A73E8" stroke="#1A73E8"/>
  <text x="1120" y="90" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BrowserInstance</text>
  <text x="1120" y="116" font-size="10" fill="#666666" text-anchor="middle">系统</text>

  <!-- 8. CaptchaLoop（系统组件：#1A73E8 蓝色） -->
  <rect x="1250" y="70" width="100" height="30" rx="4" fill="#1A73E8" stroke="#1A73E8"/>
  <text x="1300" y="90" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CaptchaLoop</text>
  <text x="1300" y="116" font-size="10" fill="#666666" text-anchor="middle">系统</text>

  <!-- 9. 服务端（外部系统：#9CA3AF 灰色） -->
  <rect x="1410" y="70" width="100" height="30" rx="4" fill="#9CA3AF" stroke="#9CA3AF"/>
  <text x="1460" y="90" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">服务端</text>
  <text x="1460" y="116" font-size="10" fill="#666666" text-anchor="middle">外部系统</text>

  <!-- ========================================================== -->
  <!-- 生命线（虚线 stroke="#999999" stroke-dasharray="8 4" stroke-width="1"） -->
  <!-- 从头部底部 y=100 向下延伸至图底部 y=1030 -->
  <!-- ========================================================== -->
  <line x1="100" y1="100" x2="100" y2="1030" stroke="#999999" stroke-width="1" stroke-dasharray="8 4"/>
  <line x1="280" y1="100" x2="280" y2="1030" stroke="#999999" stroke-width="1" stroke-dasharray="8 4"/>
  <line x1="460" y1="100" x2="460" y2="1030" stroke="#999999" stroke-width="1" stroke-dasharray="8 4"/>
  <line x1="620" y1="100" x2="620" y2="1030" stroke="#999999" stroke-width="1" stroke-dasharray="8 4"/>
  <line x1="780" y1="100" x2="780" y2="1030" stroke="#999999" stroke-width="1" stroke-dasharray="8 4"/>
  <line x1="940" y1="100" x2="940" y2="1030" stroke="#999999" stroke-width="1" stroke-dasharray="8 4"/>
  <line x1="1120" y1="100" x2="1120" y2="1030" stroke="#999999" stroke-width="1" stroke-dasharray="8 4"/>
  <line x1="1300" y1="100" x2="1300" y2="1030" stroke="#999999" stroke-width="1" stroke-dasharray="8 4"/>
  <line x1="1460" y1="100" x2="1460" y2="1030" stroke="#999999" stroke-width="1" stroke-dasharray="8 4"/>

  <!-- ========================================================== -->
  <!-- §3.1 主流程（消息 1-16，y=120~720，间距40px≥24px） -->
  <!-- ========================================================== -->

  <!-- 1. y=120: Supervisor → Worker: 拉起进程 (start_worker) [同步] -->
  <path d="M 100 120 L 280 120" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <g>
    <rect x="124" y="108" width="120" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="184" y="116" font-size="11" fill="#333333" text-anchor="middle">拉起进程 (start_worker)</text>
  </g>
  <text x="286" y="116" font-size="10" font-weight="bold" fill="#DC2626">≤500ms</text>

  <!-- 2. y=160: Worker → LocalStore: 拉取 pending_confirm 任务 [同步] -->
  <path d="M 280 160 L 460 160" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <g>
    <rect x="292" y="148" width="156" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="370" y="156" font-size="11" fill="#333333" text-anchor="middle">拉取 pending_confirm 任务</text>
  </g>

  <!-- 3. y=200: Worker → Worker: 解密 Cookie 流程 [自调用 右→下→左→上] -->
  <path d="M 280 200 C 310 200, 310 224, 280 224" fill="none" stroke="#333333" stroke-width="1.5"/>
  <g>
    <rect x="286" y="184" width="96" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="334" y="196" font-size="11" fill="#333333" text-anchor="middle">解密 Cookie 流程</text>
  </g>

  <!-- 4. y=240: Worker → DeviceVault: unlock_with_platform_auth() [同步] -->
  <path d="M 280 240 L 620 240" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <g>
    <rect x="366" y="228" width="168" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="450" y="236" font-size="11" fill="#333333" text-anchor="middle">unlock_with_platform_auth()</text>
  </g>
  <text x="626" y="236" font-size="10" font-weight="bold" fill="#DC2626">≤200ms</text>

  <!-- 5. y=280: DeviceVault → Worker: 返回 master_key [返回] -->
  <path d="M 620 280 L 280 280" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrow-return)"/>
  <g>
    <rect x="400" y="268" width="100" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="450" y="276" font-size="11" fill="#333333" text-anchor="middle">返回 master_key</text>
  </g>

  <!-- 6. y=320: Worker → CookieVault: decrypt(kek) [同步] -->
  <path d="M 280 320 L 780 320" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <g>
    <rect x="490" y="308" width="80" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="530" y="316" font-size="11" fill="#333333" text-anchor="middle">decrypt(kek)</text>
  </g>

  <!-- 7. y=360: CookieVault → Worker: 返回明文 Cookie [返回] -->
  <path d="M 780 360 L 280 360" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrow-return)"/>
  <g>
    <rect x="482" y="348" width="96" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="530" y="356" font-size="11" fill="#333333" text-anchor="middle">返回明文 Cookie</text>
  </g>

  <!-- 8. y=400: Worker → BrowserPool: acquire(platform, account) [同步] -->
  <path d="M 280 400 L 940 400" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <g>
    <rect x="530" y="388" width="160" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="610" y="396" font-size="11" fill="#333333" text-anchor="middle">acquire(platform, account)</text>
  </g>
  <text x="946" y="396" font-size="10" font-weight="bold" fill="#DC2626">≤200ms</text>

  <!-- 9. y=440: BrowserPool → BrowserInstance: launch() [同步] -->
  <path d="M 940 440 L 1120 440" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <g>
    <rect x="1000" y="428" width="60" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="1030" y="436" font-size="11" fill="#333333" text-anchor="middle">launch()</text>
  </g>

  <!-- 10. y=480: BrowserInstance → Worker: 实例就绪 [返回] -->
  <path d="M 1120 480 L 280 480" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrow-return)"/>
  <g>
    <rect x="672" y="468" width="56" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="700" y="476" font-size="11" fill="#333333" text-anchor="middle">实例就绪</text>
  </g>

  <!-- 11. y=520: Worker → BrowserInstance: navigate(url) [同步] -->
  <path d="M 280 520 L 1120 520" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <g>
    <rect x="657" y="508" width="86" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="700" y="516" font-size="11" fill="#333333" text-anchor="middle">navigate(url)</text>
  </g>
  <text x="1126" y="516" font-size="10" font-weight="bold" fill="#DC2626">≤2000ms</text>

  <!-- 12. y=560: Worker → BrowserInstance: fill_form(selector, value) [同步] -->
  <path d="M 280 560 L 1120 560" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <g>
    <rect x="620" y="548" width="160" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="700" y="556" font-size="11" fill="#333333" text-anchor="middle">fill_form(selector, value)</text>
  </g>

  <!-- 13. y=600: Worker → BrowserInstance: submit() [同步] -->
  <path d="M 280 600 L 1120 600" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <g>
    <rect x="670" y="588" width="60" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="700" y="596" font-size="11" fill="#333333" text-anchor="middle">submit()</text>
  </g>
  <text x="1126" y="596" font-size="10" font-weight="bold" fill="#DC2626">≤5000ms</text>

  <!-- 14. y=640: BrowserInstance → Worker: 返回 2xx 成功 [返回] -->
  <path d="M 1120 640 L 280 640" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrow-return)"/>
  <g>
    <rect x="662" y="628" width="76" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="700" y="636" font-size="11" fill="#333333" text-anchor="middle">返回 2xx 成功</text>
  </g>

  <!-- 15. y=680: Worker → LocalStore: 回写 submitted 状态 [同步] -->
  <path d="M 280 680 L 460 680" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <g>
    <rect x="312" y="668" width="116" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="370" y="676" font-size="11" fill="#333333" text-anchor="middle">回写 submitted 状态</text>
  </g>

  <!-- 16. y=720: LocalStore → 服务端: 同步事件 [同步] -->
  <path d="M 460 720 L 1460 720" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <g>
    <rect x="932" y="708" width="56" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="960" y="716" font-size="11" fill="#333333" text-anchor="middle">同步事件</text>
  </g>
  <text x="1466" y="716" font-size="10" font-weight="bold" fill="#DC2626">≤500ms</text>

  <!-- ========================================================== -->
  <!-- §3.2 验证码分支（opt 框内，消息 17-18，y=800~840） -->
  <!-- ========================================================== -->

  <!-- 17. y=800: BrowserInstance → CaptchaLoop: detect_captcha()==true [同步] -->
  <path d="M 1120 800 L 1300 800" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <g>
    <rect x="1140" y="788" width="140" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="1210" y="796" font-size="11" fill="#333333" text-anchor="middle">detect_captcha()==true</text>
  </g>

  <!-- 18. y=840: CaptchaLoop → Worker: suspend_task() → 回退 [返回] -->
  <path d="M 1300 840 L 280 840" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrow-return)"/>
  <g>
    <rect x="690" y="828" width="200" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="790" y="836" font-size="11" fill="#333333" text-anchor="middle">suspend_task() → 回退 pending_confirm</text>
  </g>

  <!-- ========================================================== -->
  <!-- §3.5 断网补传（opt 框内，消息 19-20，y=940~980） -->
  <!-- ========================================================== -->

  <!-- 19. y=940: LocalStore → LocalStore: get_pending_sync() [自调用 右→下→左→上] -->
  <path d="M 460 940 C 490 940, 490 964, 460 964" fill="none" stroke="#333333" stroke-width="1.5"/>
  <g>
    <rect x="466" y="924" width="112" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="522" y="936" font-size="11" fill="#333333" text-anchor="middle">get_pending_sync()</text>
  </g>

  <!-- 20. y=980: LocalStore → 服务端: mark_synced(ids) [同步] -->
  <path d="M 460 980 L 1460 980" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <g>
    <rect x="907" y="968" width="106" height="16" fill="#FFFFFF" stroke="none"/>
    <text x="960" y="976" font-size="11" fill="#333333" text-anchor="middle">mark_synced(ids)</text>
  </g>

  <!-- ========================================================== -->
  <!-- 图例区（y=1060 > 主图最低元素 y=1020 + 20px） -->
  <!-- 必须包含全部五项：同步消息、异步消息、返回消息、alt组合片段、激活条 -->
  <!-- ========================================================== -->
  <rect x="40" y="1060" width="1520" height="80" rx="6" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
  <text x="56" y="1078" font-size="11" font-weight="bold" fill="#333333">图例</text>

  <!-- 第1行：同步消息 + 异步消息 + 返回消息 -->
  <line x1="56" y1="1100" x2="116" y2="1100" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="126" y="1104" font-size="11" fill="#333333">同步消息</text>

  <line x1="240" y1="1100" x2="300" y2="1100" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow-async)"/>
  <text x="310" y="1104" font-size="11" fill="#333333">异步消息</text>

  <line x1="440" y1="1100" x2="500" y2="1100" stroke="#999999" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrow-return)"/>
  <text x="510" y="1104" font-size="11" fill="#333333">返回消息</text>

  <!-- 第2行：alt组合片段 + 激活条 -->
  <rect x="56" y="1118" width="30" height="14" fill="#F0F0F0" stroke="#AAAAAA" stroke-width="0.5"/>
  <text x="96" y="1129" font-size="11" fill="#333333">alt 组合片段</text>

  <rect x="240" y="1118" width="14" height="14" fill="#DBEAFE" stroke="#1A73E8" stroke-width="0.5"/>
  <text x="264" y="1129" font-size="11" fill="#333333">激活条（4px 宽 #DBEAFE）</text>

  <!-- ========================================================== -->
  <!-- 元数据 -->
  <!-- ========================================================== -->
  <text x="20" y="1140" font-size="9" fill="#9CA3AF">fig-4-3-sequence-delivery.svg · v3.0 · 2026-08-16 · 9 参与者 / 20 消息 / 2 opt</text>
  <text x="1580" y="1140" font-size="9" fill="#9CA3AF" text-anchor="end">标准: 作图-04-UML时序图.md</text>
</svg>