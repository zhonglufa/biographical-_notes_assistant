  <!--
    fig-5-1-er.svg v2.0 (2026-08-15) 修复黄色控件 + 乱线（零交叉 / 零穿盒）
    修复 1: ④ PLATFORM_ACCOUNT 的 ⚠ Cookie 注释由 #F59E0B（基础设施黄）改为 #9ca3af（注释灰）
    修复 2: ①→⑤ / ①→⑧ / ①→⑬ 原为 x=170 同列直线，垂直穿透 ②③⑤ 盒
            → 改走 USER 右侧走廊 L 形（竖井 x=395/405/415），返回段 y=565/685/810
            （y 均 > 主链竖井顶端 455，与主链零交叉）
    修复 3: 主链 ③→⑨ 原经 y=720 长绕行（并穿 PLATFORM_ADAPTER 邻域）
            → 改走顶部走廊: ③右(280,455) → x=385 竖井上行 → y=150 横穿 → x=670 竖井
              下行 → y=360 进 ⑨ 左边界（y=150 高于所有出线点、y=360 距 ⑨ 顶 20px）
    修复 4: ①→⑬ 原 y=170 水平段与 ①→④ 完全重叠 → 出线点分层 y=182/198/214
    修复 5: ①→⑭ 原 y=195 贴 PLATFORM_ACCOUNT/JOB 顶 5px 且 860px 蛇形
            → 改走最高通道 y=130（距所有盒顶 ≥55px），右侧 x=1530 竖井进 ⑭ 右边界
    修复 6: 底部说明框下移至 y=950..1010（⑬ 底 910 之下 40px），幅面 1050
  -->

  <!-- 标题 -->
  <text x="810" y="28" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">图 5-1 核心实体关系图（ER，14 实体 / 4 域）</text>
  <text x="810" y="46" font-size="10" fill="#6b7280" text-anchor="middle">用户域 / 平台域 / 投递域（枢纽）/ 面试域 · 主链路以绿色加粗标识，全链路靠 idempotency_key 保证不重不漏</text>

  <!-- 图例 -->
  <text x="810" y="62" font-size="9" fill="#6b7280" text-anchor="middle">━━━ 普通关系 (1:N) ━━━ 主链路 (绿色加粗) · 每个实体含中文名 + 英文表名 + 2-3 个关键字段</text>

