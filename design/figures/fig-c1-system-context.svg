<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" style="background:#ffffff;font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif">
  <!-- fig-c1-system-context.svg | 对应 HLD §2.2 C1 系统上下文图 | 2026-08-15 -->
  <defs>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 0 L 9 5 L 1 10" fill="none" stroke="#666666" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="600" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">图 C1  系统上下文图</text>
  <text x="600" y="52" text-anchor="middle" font-size="10" fill="#6B7280">AI 简历助手：系统边界、外部依赖与参与者</text>

  <!-- 求职者（参与者） -->
  <rect x="60" y="290" width="200" height="110" rx="6" fill="#E8A317"/>
  <text x="160" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">求职者</text>
  <text x="160" y="354" text-anchor="middle" font-size="10" fill="#FFFFFF">系统用户 · 求职者画像</text>
  <text x="160" y="374" text-anchor="middle" font-size="10" fill="#FFFFFF">投递申请 / 管理策略</text>

  <!-- 系统边界框 -->
  <rect x="430" y="190" width="340" height="410" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="448" y="212" font-size="11" fill="#333333">系统边界</text>

  <!-- AI 简历助手（待建系统，黑盒） -->
  <rect x="460" y="245" width="280" height="250" rx="8" fill="#1A73E8"/>
  <text x="600" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">AI 简历助手</text>
  <text x="600" y="340" text-anchor="middle" font-size="10" fill="#FFFFFF">简历自动投递与面试模拟系统</text>
  <text x="600" y="360" text-anchor="middle" font-size="10" fill="#FFFFFF">自动投递 · AI 匹配 · 面试模拟</text>

  <!-- 招聘平台（外部系统） -->
  <rect x="900" y="215" width="240" height="85" rx="6" fill="#9CA3AF"/>
  <text x="1020" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">招聘平台</text>
  <text x="1020" y="265" text-anchor="middle" font-size="9" fill="#FFFFFF">BOSS直聘 / 猎聘 / 智联招聘 / 前程无忧 / 拉勾</text>
  <text x="1020" y="283" text-anchor="middle" font-size="10" fill="#FFFFFF">不主动回推，仅尽力感知</text>

  <!-- 邮件服务（外部系统） -->
  <rect x="900" y="310" width="240" height="85" rx="6" fill="#9CA3AF"/>
  <text x="1020" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">邮件服务</text>
  <text x="1020" y="360" text-anchor="middle" font-size="10" fill="#FFFFFF">通知推送</text>

  <!-- AI 大模型（外部系统） -->
  <rect x="900" y="405" width="240" height="85" rx="6" fill="#9CA3AF"/>
  <text x="1020" y="435" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">AI 大模型</text>
  <text x="1020" y="455" text-anchor="middle" font-size="10" fill="#FFFFFF">主 + 备用 LLM</text>
  <text x="1020" y="473" text-anchor="middle" font-size="10" fill="#FFFFFF">流式返回</text>

  <!-- 文件存储（外部系统） -->
  <rect x="900" y="500" width="240" height="85" rx="6" fill="#9CA3AF"/>
  <text x="1020" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">文件存储</text>
  <text x="1020" y="550" text-anchor="middle" font-size="10" fill="#FFFFFF">简历附件 / 缓存</text>

  <!-- 连接线（关系描述，无协议信息） -->
  <!-- ① 求职者 → 系统 -->
  <line x1="260" y1="345" x2="426" y2="345" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="343" y="341" text-anchor="middle" font-size="11" fill="#333333">管理投递策略</text>

  <!-- ② 系统 → 招聘平台 -->
  <line x1="770" y1="245" x2="896" y2="245" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="833" y="241" text-anchor="middle" font-size="11" fill="#333333">自动投递 / 状态感知</text>

  <!-- ③ 系统 → 邮件服务（异步） -->
  <line x1="770" y1="345" x2="896" y2="345" stroke="#666666" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-async)"/>
  <text x="833" y="341" text-anchor="middle" font-size="11" fill="#333333">推送通知</text>

  <!-- ④ 系统 → AI 大模型 -->
  <line x1="770" y1="445" x2="896" y2="445" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="833" y="441" text-anchor="middle" font-size="11" fill="#333333">匹配打分 / 面试</text>

  <!-- ⑤ AI 大模型 → 系统（流式返回） -->
  <line x1="896" y1="470" x2="770" y2="470" stroke="#666666" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-async)"/>
  <text x="833" y="466" text-anchor="middle" font-size="11" fill="#333333">流式返回</text>

  <!-- ⑥ 系统 → 文件存储 -->
  <line x1="770" y1="545" x2="896" y2="545" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="833" y="541" text-anchor="middle" font-size="11" fill="#333333">备份附件</text>

  <!-- 图例 -->
  <rect x="60" y="630" width="620" height="56" rx="6" fill="#F8F9FA" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="652" font-size="11" font-weight="bold" fill="#333333">图例</text>
  <line x1="130" y1="650" x2="170" y2="650" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="178" y="654" font-size="11" fill="#333333">同步调用</text>
  <line x1="270" y1="650" x2="310" y2="650" stroke="#666666" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-async)"/>
  <text x="318" y="654" font-size="11" fill="#333333">异步 / 流式</text>
  <rect x="420" y="638" width="18" height="18" rx="3" fill="#E8A317"/>
  <text x="444" y="651" font-size="11" fill="#333333">参与者</text>
  <rect x="505" y="638" width="18" height="18" rx="3" fill="#1A73E8"/>
  <text x="529" y="651" font-size="11" fill="#333333">系统</text>
  <rect x="580" y="638" width="18" height="18" rx="3" fill="#9CA3AF"/>
  <text x="604" y="651" font-size="11" fill="#333333">外部系统</text>
</svg>