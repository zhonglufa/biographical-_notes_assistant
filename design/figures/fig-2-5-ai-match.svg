<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" style="background:#ffffff;font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 0 L 9 5 L 1 10" fill="none" stroke="#999999" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 0 L 9 5 L 1 10" fill="none" stroke="#666666" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="590" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">图 2-5  AI 匹配与降级（LLM 主备切换）时序图</text>
  <text x="590" y="50" text-anchor="middle" font-size="10" fill="#6B7280">发起 → 预检 → 主 LLM → 备用 LLM（golden set 回归）→ 失败降级规则引擎 → 统一响应</text>

  <!-- 参与者头部：系统 #1A73E8 · 外部系统 #9CA3AF -->
  <rect x="70" y="64" width="140" height="42" rx="6" fill="#1A73E8"/>
  <text x="140" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Java 业务</text>
  <text x="140" y="103" text-anchor="middle" font-size="10" fill="#FFFFFF">岗位模块</text>

  <rect x="270" y="64" width="140" height="42" rx="6" fill="#1A73E8"/>
  <text x="340" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Python 编排</text>
  <text x="340" y="103" text-anchor="middle" font-size="10" fill="#FFFFFF">LLM 网关</text>

  <rect x="540" y="64" width="120" height="42" rx="6" fill="#9CA3AF"/>
  <text x="600" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">主 LLM</text>
  <text x="600" y="103" text-anchor="middle" font-size="10" fill="#FFFFFF">DeepSeek</text>

  <rect x="720" y="64" width="120" height="42" rx="6" fill="#9CA3AF"/>
  <text x="780" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">备用 LLM</text>
  <text x="780" y="103" text-anchor="middle" font-size="10" fill="#FFFFFF">境内合规</text>

  <rect x="920" y="64" width="120" height="42" rx="6" fill="#9CA3AF"/>
  <text x="980" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">规则引擎</text>
  <text x="980" y="103" text-anchor="middle" font-size="10" fill="#FFFFFF">关键词匹配</text>

  <!-- 生命线 -->
  <line x1="140" y1="106" x2="140" y2="672" stroke="#999999" stroke-width="1.5" stroke-dasharray="8,4"/>
  <line x1="340" y1="106" x2="340" y2="672" stroke="#999999" stroke-width="1.5" stroke-dasharray="8,4"/>
  <line x1="600" y1="106" x2="600" y2="672" stroke="#999999" stroke-width="1.5" stroke-dasharray="8,4"/>
  <line x1="780" y1="106" x2="780" y2="672" stroke="#999999" stroke-width="1.5" stroke-dasharray="8,4"/>
  <line x1="980" y1="106" x2="980" y2="672" stroke="#999999" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- alt 组合片段（极细实线边框 + 圆角矩形 namebox） -->
  <rect x="80" y="388" width="960" height="252" fill="none" stroke="#AAAAAA" stroke-width="0.5"/>

  <!-- 激活条（在 namebox 之前绘制，namebox 背景覆盖重叠区域） -->
  <rect x="138" y="148" width="4" height="530" fill="#DBEAFE"/>
  <rect x="338" y="148" width="4" height="530" fill="#DBEAFE"/>
  <rect x="598" y="246" width="4" height="44" fill="#DBEAFE"/>
  <rect x="778" y="326" width="4" height="44" fill="#DBEAFE"/>
  <rect x="978" y="578" width="4" height="44" fill="#DBEAFE"/>

  <!-- namebox（圆角矩形背景覆盖下方激活条，确保文字不被遮挡） -->
  <rect x="80" y="388" width="124" height="22" rx="4" fill="#F5F5F5" stroke="#AAAAAA" stroke-width="0.5"/>
  <text x="142" y="401" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">alt [备用 LLM 结果]</text>

  <!-- ① 发起匹配（同步） -->
  <path d="M 142 168 L 336 168" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="240" y="164" text-anchor="middle" font-size="11" fill="#333333">发起 AI 匹配请求（≤5s 预算）</text>

  <!-- ② 配额 / 超时预检（自调用） -->
  <path d="M 342 208 H 390 V 226 H 342" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="398" y="216" font-size="11" fill="#333333">配额 / 超时预检（供应商探测）</text>

  <!-- ③ 调用主 LLM（同步） -->
  <path d="M 342 248 L 596 248" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="470" y="244" text-anchor="middle" font-size="11" fill="#333333">调用主 LLM（HTTPS）</text>

  <!-- ④ 主不可达（返回 / 异常） -->
  <path d="M 602 288 L 338 288" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-return)"/>
  <text x="470" y="284" text-anchor="middle" font-size="11" fill="#333333">主不可达：超时 / 5xx 超阈值</text>

  <!-- ⑤ 切换备用 LLM（同步） -->
  <path d="M 342 328 L 776 328" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="560" y="324" text-anchor="middle" font-size="11" fill="#333333">切备用 LLM + golden set 回归（κ 容差）</text>

  <!-- 分支一：备用成功 -->
  <path d="M 780 448 L 338 448" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-return)"/>
  <text x="560" y="444" text-anchor="middle" font-size="11" fill="#333333">备用成功：分数 + 理由</text>

  <!-- 分隔线 -->
  <line x1="88" y1="505" x2="1032" y2="505" stroke="#D0D0D0" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- 分支二：主备均不可用 → 降级规则引擎 -->
  <path d="M 780 540 L 338 540" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-return)"/>
  <text x="560" y="536" text-anchor="middle" font-size="11" fill="#333333">等待超时：主备均不可用</text>

  <path d="M 342 580 L 976 580" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="660" y="576" text-anchor="middle" font-size="11" fill="#333333">降级：规则引擎关键词匹配</text>

  <path d="M 982 620 L 342 620" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-return)"/>
  <text x="660" y="616" text-anchor="middle" font-size="11" fill="#333333">规则结果：分数 + 理由</text>

  <!-- ⑥ 统一响应（返回） -->
  <path d="M 338 676 L 142 676" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-return)"/>
  <text x="240" y="672" text-anchor="middle" font-size="11" fill="#333333">统一响应：分数 / 理由 / 模型名 / 耗时</text>

  <!-- 图例（与上方最后一条消息保持 20px 间距） -->
  <rect x="160" y="698" width="860" height="60" rx="6" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="175" y="717" font-size="11" font-weight="bold" fill="#1f2937">图例</text>

  <line x1="270" y1="717" x2="320" y2="717" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="326" y="720" font-size="10" fill="#333333">同步调用</text>
  <line x1="450" y1="717" x2="500" y2="717" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow-async)"/>
  <text x="506" y="720" font-size="10" fill="#333333">异步消息</text>
  <line x1="630" y1="717" x2="680" y2="717" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-return)"/>
  <text x="686" y="720" font-size="10" fill="#333333">返回 / 异常</text>

  <rect x="800" y="709" width="30" height="16" rx="3" fill="#F5F5F5" stroke="#AAAAAA" stroke-width="0.5"/>
  <text x="836" y="720" font-size="10" fill="#333333">alt 条件分支</text>

  <rect x="270" y="740" width="4" height="14" fill="#DBEAFE"/>
  <text x="280" y="748" font-size="10" fill="#333333">激活条（生命线活跃期）</text>
</svg>