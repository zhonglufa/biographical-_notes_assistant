<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" style="background:#ffffff;font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif">
  <!-- fig-c2-container.svg | 对应 HLD §2.2 C2 容器图 | 三层垂直布局：业务层 / 数据层 / 基础设施层 + 外部系统 -->
  <defs>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="600" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">图 C2  容器图</text>
  <text x="600" y="50" text-anchor="middle" font-size="10" fill="#6B7280">AI 简历助手：可部署单元与通信路径（每条线标注 协议:端口）</text>

  <!-- ===================== 业务层 ===================== -->
  <rect x="60" y="95" width="830" height="150" rx="8" fill="#F8F9FA" stroke="#E2E8F0" stroke-width="1"/>
  <text x="70" y="112" font-size="12" font-weight="bold" fill="#333333">业务层</text>

  <!-- Java 后端服务（容器） -->
  <rect x="90" y="120" width="170" height="105" rx="6" fill="#FFFFFF" stroke="#1A73E8" stroke-width="2"/>
  <text x="175" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A73E8">Java 后端服务</text>
  <text x="175" y="165" text-anchor="middle" font-size="11" fill="#333333">Spring Boot 3.x</text>
  <text x="175" y="183" text-anchor="middle" font-size="10" fill="#6B7280">REST API · 业务编排 · 状态机</text>
  <text x="175" y="199" text-anchor="middle" font-size="10" fill="#6B7280">任务调度 · 通知 · 账号/简历</text>
  <text x="175" y="215" text-anchor="middle" font-size="9" fill="#6B7280">[Container]</text>

  <!-- Python LLM 网关（容器） -->
  <rect x="320" y="120" width="170" height="105" rx="6" fill="#FFFFFF" stroke="#1A73E8" stroke-width="2"/>
  <text x="405" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A73E8">Python LLM 网关</text>
  <text x="405" y="165" text-anchor="middle" font-size="11" fill="#333333">FastAPI</text>
  <text x="405" y="183" text-anchor="middle" font-size="10" fill="#6B7280">LLM 编排 · 主/备切换 · 降级</text>
  <text x="405" y="199" text-anchor="middle" font-size="10" fill="#6B7280">AI 匹配 · 面试模拟对话</text>
  <text x="405" y="215" text-anchor="middle" font-size="9" fill="#6B7280">[Container]</text>

  <!-- 客户端（容器） -->
  <rect x="550" y="120" width="110" height="105" rx="6" fill="#FFFFFF" stroke="#1A73E8" stroke-width="2"/>
  <text x="605" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A73E8">客户端</text>
  <text x="605" y="165" text-anchor="middle" font-size="11" fill="#333333">Web (Vue 3)</text>
  <text x="605" y="183" text-anchor="middle" font-size="10" fill="#6B7280">Mobile</text>
  <text x="605" y="199" text-anchor="middle" font-size="10" fill="#6B7280">(uni-app)</text>
  <text x="605" y="215" text-anchor="middle" font-size="9" fill="#6B7280">[Container]</text>

  <!-- 本机 Agent（容器，用户侧） -->
  <rect x="720" y="120" width="160" height="105" rx="6" fill="#FFFFFF" stroke="#1A73E8" stroke-width="2"/>
  <text x="800" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A73E8">本机 Agent</text>
  <text x="800" y="165" text-anchor="middle" font-size="11" fill="#333333">用户 PC 守护进程</text>
  <text x="800" y="183" text-anchor="middle" font-size="10" fill="#6B7280">Playwright 实例池 ≤3</text>
  <text x="800" y="199" text-anchor="middle" font-size="10" fill="#6B7280">本地加密 Cookie · 适配器</text>
  <text x="800" y="215" text-anchor="middle" font-size="9" fill="#6B7280">[Container] 用户侧</text>

  <!-- ===================== 数据层 ===================== -->
  <rect x="60" y="290" width="830" height="110" rx="8" fill="#F8F9FA" stroke="#E2E8F0" stroke-width="1"/>
  <text x="70" y="307" font-size="12" font-weight="bold" fill="#333333">数据层</text>

  <!-- MySQL 8.0 主从（容器） -->
  <rect x="90" y="315" width="170" height="75" rx="6" fill="#FFFFFF" stroke="#22C55E" stroke-width="2"/>
  <text x="175" y="339" text-anchor="middle" font-size="13" font-weight="bold" fill="#22C55E">MySQL 8.0 主从</text>
  <text x="175" y="358" text-anchor="middle" font-size="11" fill="#333333">业务数据</text>
  <text x="175" y="376" text-anchor="middle" font-size="10" fill="#6B7280">仅 Java 直连</text>

  <!-- Redis 7（容器） -->
  <rect x="320" y="315" width="170" height="75" rx="6" fill="#FFFFFF" stroke="#22C55E" stroke-width="2"/>
  <text x="405" y="339" text-anchor="middle" font-size="13" font-weight="bold" fill="#22C55E">Redis 7</text>
  <text x="405" y="358" text-anchor="middle" font-size="11" fill="#333333">缓存 · 锁 · 幂等</text>
  <text x="405" y="376" text-anchor="middle" font-size="10" fill="#6B7280">Java / Python 共享</text>

  <!-- ===================== 基础设施层 ===================== -->
  <rect x="60" y="445" width="830" height="100" rx="8" fill="#F8F9FA" stroke="#E2E8F0" stroke-width="1"/>
  <text x="70" y="462" font-size="12" font-weight="bold" fill="#333333">基础设施层</text>

  <!-- RabbitMQ 3.13（容器） -->
  <rect x="400" y="470" width="180" height="65" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="490" y="494" text-anchor="middle" font-size="13" font-weight="bold" fill="#F59E0B">RabbitMQ 3.13</text>
  <text x="490" y="513" text-anchor="middle" font-size="11" fill="#333333">异步消息总线</text>
  <text x="490" y="529" text-anchor="middle" font-size="10" fill="#6B7280">延迟 · 死信 · 幂等</text>

  <!-- ===================== 外部系统 ===================== -->
  <text x="975" y="118" font-size="12" font-weight="bold" fill="#333333">外部系统</text>

  <!-- 招聘平台（外部系统） -->
  <rect x="940" y="130" width="210" height="105" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  <text x="1045" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#6B7280">招聘平台</text>
  <text x="1045" y="175" text-anchor="middle" font-size="11" fill="#333333">BOSS / 猎聘 / 智联等</text>
  <text x="1045" y="193" text-anchor="middle" font-size="10" fill="#6B7280">不主动回推</text>
  <text x="1045" y="209" text-anchor="middle" font-size="10" fill="#6B7280">仅尽力感知</text>

  <!-- AI 大模型（外部系统） -->
  <rect x="940" y="320" width="210" height="105" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  <text x="1045" y="346" text-anchor="middle" font-size="13" font-weight="bold" fill="#6B7280">AI 大模型</text>
  <text x="1045" y="365" text-anchor="middle" font-size="11" fill="#333333">主 + 备用 LLM</text>
  <text x="1045" y="383" text-anchor="middle" font-size="10" fill="#6B7280">OpenAI 兼容 API</text>
  <text x="1045" y="399" text-anchor="middle" font-size="10" fill="#6B7280">流式返回</text>

  <!-- ===================== 连接线（协议:端口） ===================== -->
  <!-- ① 客户端 → Java：HTTPS REST（顶部走廊 y=100） -->
  <path d="M 605 120 L 605 100 L 175 100 L 175 120" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <rect x="357" y="88" width="66" height="13" rx="3" fill="#FFFFFF"/>
  <text x="390" y="98" text-anchor="middle" font-size="11" fill="#333333">REST:443</text>

  <!-- ② Java ↔ Python：内部 REST（水平 y=180） -->
  <line x1="260" y1="180" x2="320" y2="180" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <rect x="260" y="168" width="52" height="13" rx="3" fill="#FFFFFF"/>
  <text x="286" y="178" text-anchor="middle" font-size="11" fill="#333333">REST:8000</text>

  <!-- ③ Java → MySQL：JDBC（垂直 x=145） -->
  <line x1="145" y1="225" x2="145" y2="315" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <rect x="145" y="258" width="66" height="13" rx="3" fill="#FFFFFF"/>
  <text x="178" y="268" text-anchor="middle" font-size="11" fill="#333333">JDBC:3306</text>

  <!-- ④ Java → Redis：Lettuce（下轨 y=265） -->
  <path d="M 215 225 L 215 265 L 350 265 L 350 315" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <rect x="233" y="253" width="76" height="13" rx="3" fill="#FFFFFF"/>
  <text x="271" y="263" text-anchor="middle" font-size="11" fill="#333333">Lettuce:6379</text>

  <!-- ⑤ Java → RabbitMQ：AMQP（总线 y=250 → 干线 x=542） -->
  <path d="M 250 225 L 250 250 L 542 250 L 542 470" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <rect x="549" y="353" width="80" height="13" rx="3" fill="#FFFFFF"/>
  <text x="589" y="363" text-anchor="middle" font-size="11" fill="#333333">AMQP:5672</text>

  <!-- ⑥ Python → RabbitMQ：AMQP 订阅（汇入总线） -->
  <path d="M 440 225 L 440 250 L 542 250" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <rect x="444" y="236" width="48" height="13" rx="3" fill="#FFFFFF"/>
  <text x="468" y="246" text-anchor="middle" font-size="11" fill="#333333">AMQP</text>

  <!-- ⑦ Java → 本机 Agent：任务通道（长连接，顶部走廊 y=84） -->
  <path d="M 120 120 L 120 84 L 790 84 L 790 120" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <rect x="497" y="66" width="116" height="13" rx="3" fill="#FFFFFF"/>
  <text x="555" y="76" text-anchor="middle" font-size="11" fill="#333333">WSS:443 任务通道</text>

  <!-- ⑧ 本机 Agent → 招聘平台：浏览器自动化（水平 y=165） -->
  <line x1="880" y1="165" x2="940" y2="165" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <rect x="882" y="153" width="50" height="13" rx="3" fill="#FFFFFF"/>
  <text x="907" y="163" text-anchor="middle" font-size="11" fill="#333333">HTTPS:443</text>

  <!-- ⑨ Python → AI 大模型：LLM API（下轨 y=236 → 干线 x=920） -->
  <path d="M 470 225 L 470 236 L 920 236 L 920 345 L 940 345" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <rect x="657" y="223" width="66" height="13" rx="3" fill="#FFFFFF"/>
  <text x="690" y="233" text-anchor="middle" font-size="11" fill="#333333">HTTPS:443</text>

  <!-- ===================== 图例 ===================== -->
  <rect x="280" y="598" width="640" height="62" rx="6" fill="#F8F9FA" stroke="#E2E8F0" stroke-width="1"/>
  <text x="300" y="620" font-size="11" font-weight="bold" fill="#333333">图例</text>
  <rect x="356" y="608" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#1A73E8" stroke-width="2"/>
  <text x="380" y="621" font-size="11" fill="#333333">业务层容器</text>
  <rect x="466" y="608" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#22C55E" stroke-width="2"/>
  <text x="490" y="621" font-size="11" fill="#333333">数据层容器</text>
  <rect x="576" y="608" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="600" y="621" font-size="11" fill="#333333">基础设施层</text>
  <rect x="686" y="608" width="18" height="18" rx="3" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  <text x="710" y="621" font-size="11" fill="#333333">外部系统</text>
  <line x1="356" y1="642" x2="392" y2="642" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="400" y="646" font-size="11" fill="#333333">同步调用，线标注 协议:端口</text>
</svg>