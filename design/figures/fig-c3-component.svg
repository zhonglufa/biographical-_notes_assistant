<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" style="background:#ffffff;font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000010"/>
    </filter>
    <marker id="arrow-dep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="#333333"/>
    </marker>
    <marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!--
    ============================================================
    fig-c3-component.svg v4.0 最近原则 + 左右二分
    ============================================================
    对应: fig-c2-container.svg 中的 Java 后端服务
    规范: 作图-11-C3组件图.md §3.9
    改进 (vs v3.0):
      1. 灰盒严格左右二分, 不再分散到 3 个区
         - 左列 (x=20~200): Python 服务(上) / MySQL 8.0(下)  → 数据源/存储
         - 右列 (x=900~1080): Redis 7.2(上) / RabbitMQ 3.13(下) → 消息/缓存
      2. 取消 y=380 水平通道 (v3.0 的 4 条线在此竞争)
      3. 内部组件 2 列对齐:
         - 左列 (x=300~460): 简历解析 / 投递调度 → 对应左灰盒
         - 右列 (x=620~780): 状态跟踪 / 异步消息发布器 → 对应右灰盒
      4. 内部依赖: 控制/调度/监听层在顶部居中, 通过短 L 形下到对应业务层
      5. 跨列依赖 (业务域 A→C): 走 y=400 单一通道, 仅 1 条 (投递调度 → 异步消息)
    关键规则:
      - 灰盒与对应组件的横向中心偏差 ≤ 160px (左右二分, 不跨图)
      - 所有对外连线 L 形 ≤ 2 段, 端点 10px 间距
      - 零斜线, 全部正交
  -->

  <!-- 1. 目标容器边界 (虚线) -->
  <rect x="260" y="60" width="600" height="720" fill="none" stroke="#1A73E8" stroke-width="1.5" stroke-dasharray="6,4" rx="8"/>
  <rect x="280" y="48" width="240" height="24" fill="#ffffff" stroke="none"/>
  <text x="290" y="65" font-size="11" font-weight="bold" fill="#1A73E8">[Container: Java 后端服务]</text>

  <!-- ========================================================== -->
  <!-- 2. 内部组件 (3 层 × 2 列) -->
  <!-- ========================================================== -->

  <!-- 2.1 控制/调度/监听层 (顶部, y=100~180) - 居中 3 个 -->
  <rect x="300" y="100" width="160" height="80" rx="6" fill="#E0F2FE" stroke="#1A73E8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="125" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">控制层</text>
  <text x="380" y="143" font-size="10" fill="#6b7280" text-anchor="middle">REST API 入口</text>
  <text x="380" y="160" font-size="9" fill="#9ca3af" text-anchor="middle">[Component]</text>

  <rect x="480" y="100" width="160" height="80" rx="6" fill="#E0F2FE" stroke="#1A73E8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="125" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">调度层</text>
  <text x="560" y="143" font-size="10" fill="#6b7280" text-anchor="middle">定时任务入口</text>
  <text x="560" y="160" font-size="9" fill="#9ca3af" text-anchor="middle">[Component]</text>

  <rect x="660" y="100" width="160" height="80" rx="6" fill="#E0F2FE" stroke="#1A73E8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="125" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">消息监听</text>
  <text x="740" y="143" font-size="10" fill="#6b7280" text-anchor="middle">MQ 消费入口</text>
  <text x="740" y="160" font-size="9" fill="#9ca3af" text-anchor="middle">[Component]</text>

  <!-- 2.2 业务层 (中间, y=300~380) - 2 列对齐左右灰盒 -->
  <!-- 左列: 简历解析 (x=380) 对应 Python 灰盒 (左列 x=110) -->
  <rect x="300" y="300" width="160" height="80" rx="6" fill="#E0F2FE" stroke="#1A73E8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="325" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">简历解析服务</text>
  <text x="380" y="343" font-size="10" fill="#6b7280" text-anchor="middle">解析 / 抽取 / 结构化</text>
  <text x="380" y="360" font-size="9" fill="#9ca3af" text-anchor="middle">[Component]</text>

  <!-- 右列: 状态跟踪 (x=740) 对应 Redis 灰盒 (右列 x=990) -->
  <rect x="660" y="300" width="160" height="80" rx="6" fill="#E0F2FE" stroke="#1A73E8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="325" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">状态跟踪服务</text>
  <text x="740" y="343" font-size="10" fill="#6b7280" text-anchor="middle">轮询 / 状态同步</text>
  <text x="740" y="360" font-size="9" fill="#9ca3af" text-anchor="middle">[Component]</text>

  <!-- 2.3 业务层 下半 (y=420~500) - 2 列 -->
  <!-- 左列: 投递调度 (x=380) 对应 MySQL 灰盒 (左列下) -->
  <rect x="300" y="420" width="160" height="80" rx="6" fill="#E0F2FE" stroke="#1A73E8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="445" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">投递调度服务</text>
  <text x="380" y="463" font-size="10" fill="#6b7280" text-anchor="middle">异步分发 / 状态机</text>
  <text x="380" y="480" font-size="9" fill="#9ca3af" text-anchor="middle">[Component]</text>

  <!-- 右列: 异步消息发布器 (x=740) 对应 RabbitMQ 灰盒 (右列下) -->
  <rect x="660" y="420" width="160" height="80" rx="6" fill="#E0F2FE" stroke="#1A73E8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="445" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">异步消息发布器</text>
  <text x="740" y="463" font-size="10" fill="#6b7280" text-anchor="middle">RabbitMQ Producer</text>
  <text x="740" y="480" font-size="9" fill="#9ca3af" text-anchor="middle">[Component]</text>

  <!-- 2.4 数据访问层 (底部, y=600~680) - 居中合并 -->
  <rect x="300" y="600" width="520" height="80" rx="6" fill="#E0F2FE" stroke="#1A73E8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="625" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">数据访问层 (Mapper)</text>
  <text x="560" y="643" font-size="10" fill="#6b7280" text-anchor="middle">MyBatis-Plus ORM</text>
  <text x="560" y="660" font-size="9" fill="#9ca3af" text-anchor="middle">[Component]</text>

  <!-- ========================================================== -->
  <!-- 3. 接口 lollipop (3 个, 在控制层上方) -->
  <!-- ============================================================ -->
  <circle cx="380" cy="220" r="8" fill="#ffffff" stroke="#1A73E8" stroke-width="1.5"/>
  <line x1="380" y1="220" x2="380" y2="180" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="395" y="216" font-size="10" fill="#1A73E8" font-style="italic">投递API</text>

  <circle cx="560" cy="220" r="8" fill="#ffffff" stroke="#1A73E8" stroke-width="1.5"/>
  <line x1="560" y1="220" x2="560" y2="180" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="575" y="216" font-size="10" fill="#1A73E8" font-style="italic">任务调度</text>

  <circle cx="740" cy="220" r="8" fill="#ffffff" stroke="#1A73E8" stroke-width="1.5"/>
  <line x1="740" y1="220" x2="740" y2="180" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="755" y="216" font-size="10" fill="#1A73E8" font-style="italic">消费API</text>

  <!-- ========================================================== -->
  <!-- 4. 灰盒 - 左列 (数据源/存储) -->
  <!-- ============================================================ -->

  <!-- 4.1 Python 服务 (左上, 对齐简历解析 y) -->
  <rect x="20" y="300" width="180" height="60" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="110" y="322" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Python 服务</text>
  <text x="110" y="340" font-size="10" fill="#6b7280" text-anchor="middle">[Container: FastAPI]</text>

  <!-- 4.2 MySQL 8.0 (左下, 对齐投递调度 y) -->
  <rect x="20" y="420" width="180" height="60" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="110" y="442" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">MySQL 8.0</text>
  <text x="110" y="460" font-size="10" fill="#6b7280" text-anchor="middle">[Container: Database]</text>

  <!-- ========================================================== -->
  <!-- 5. 灰盒 - 右列 (消息/缓存) -->
  <!-- ============================================================ -->

  <!-- 5.1 Redis 7.2 (右上, 对齐状态跟踪 y) -->
  <rect x="900" y="300" width="180" height="60" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="990" y="322" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Redis 7.2</text>
  <text x="990" y="340" font-size="10" fill="#6b7280" text-anchor="middle">[Container: Cache]</text>

  <!-- 5.2 RabbitMQ 3.13 (右下, 对齐异步消息发布器 y) -->
  <rect x="900" y="420" width="180" height="60" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="990" y="442" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">RabbitMQ 3.13</text>
  <text x="990" y="460" font-size="10" fill="#6b7280" text-anchor="middle">[Container: Message Queue]</text>

  <!-- ========================================================== -->
  <!-- 6. 内部依赖 (实线箭头, 黑色) -->
  <!-- ============================================================ -->

  <!-- 6.1 顶部 → 业务层 (3 条, 走 y=250 通道, 各自下降到对应业务层) -->
  <!-- 控制层 (x=380) → 简历解析 (x=380) - 同列, 直线 -->
  <path d="M 380 180 L 380 300" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-dep)"/>
  <text x="365" y="245" font-size="10" fill="#333333" text-anchor="end">调用</text>

  <!-- 调度层 (x=560) → 投递调度 (x=380) - 跨列, 走 y=400 间隙 (简历解析 y=300~380, 投递调度 y=420~500) -->
  <path d="M 560 180 L 560 400 L 380 400 L 380 420" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-dep)"/>
  <text x="470" y="395" font-size="10" fill="#333333" text-anchor="middle">调度</text>

  <!-- 消息监听 (x=740) → 状态跟踪 (x=740) - 同列, 直线 -->
  <path d="M 740 180 L 740 300" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-dep)"/>
  <text x="725" y="245" font-size="10" fill="#333333" text-anchor="end">消费</text>

  <!-- 6.2 投递调度 → 异步消息发布器 (跨列) - 单段水平, 投递调度右下角 (460, 480) → 发布器左下角 (660, 480), 120px 最短 -->
  <path d="M 460 480 L 660 480" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-dep)"/>
  <text x="560" y="475" font-size="10" fill="#333333" text-anchor="middle">触发发布</text>

  <!-- 6.3 业务层 → 数据访问层 (3 条) - 全部用 L 形绕开下方同列组件 -->
  <!-- 简历解析 (x=380) → 数据层: 先下到 y=510 (在投递调度顶 y=420 之下) 行不通, 改为先左出, 沿左通道下到 y=600, 再右进数据层 -->
  <path d="M 300 380 L 290 380 L 290 600 L 300 600" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-dep)"/>
  <text x="278" y="490" font-size="10" fill="#333333" text-anchor="end">查询</text>

  <!-- 状态跟踪 (x=740) → 数据层: 先右出, 沿右通道下到 y=600, 再左进数据层 -->
  <path d="M 820 380 L 830 380 L 830 600 L 820 600" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-dep)"/>
  <text x="842" y="490" font-size="10" fill="#333333" text-anchor="start">更新</text>

  <!-- 投递调度 (x=380) → 数据层: 先左出, 沿左通道下到 y=600, 再右进数据层 (与简历解析共用 x=290 通道, 标"写"独立箭头) -->
  <path d="M 300 500 L 285 500 L 285 600 L 300 600" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-dep)"/>
  <text x="273" y="555" font-size="10" fill="#333333" text-anchor="end">写</text>

  <!-- ========================================================== -->
  <!-- 7. 业务/数据层 → 灰盒 (4 条, 严格最近原则, 全部 ≤ 2 段 L 形) -->
  <!-- ============================================================ -->

  <!-- 7.1 简历解析 (x=380) → Python 服务 (x=110, y=300~360) -->
  <!-- 路径: (300, 340) → (200, 340) - 起点组件左边缘, 水平左行到灰盒右边缘 -->
  <path d="M 300 340 L 200 340" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow-ext)"/>
  <text x="250" y="335" font-size="10" fill="#6b7280" text-anchor="middle">异步调用</text>

  <!-- 7.2 投递调度 (x=380) → MySQL 8.0 (x=110, y=420~480) -->
  <!-- 路径: (300, 460) → (200, 460) - 起点组件左边缘, 水平左行到灰盒右边缘 -->
  <path d="M 300 460 L 200 460" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow-ext)"/>
  <text x="250" y="455" font-size="10" fill="#6b7280" text-anchor="middle">持久化</text>

  <!-- 7.3 状态跟踪 (x=740) → Redis 7.2 (x=900, y=300~360) -->
  <!-- 路径: (820, 340) → (900, 340) - 起点组件右边缘, 水平右行到灰盒左边缘 -->
  <path d="M 820 340 L 900 340" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow-ext)"/>
  <text x="860" y="335" font-size="10" fill="#6b7280" text-anchor="middle">缓存读写</text>

  <!-- 7.4 异步消息发布器 (x=740) → RabbitMQ 3.13 (x=900, y=420~480) -->
  <!-- 路径: (820, 460) → (900, 460) - 起点组件右边缘, 水平右行到灰盒左边缘 -->
  <path d="M 820 460 L 900 460" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow-ext)"/>
  <text x="860" y="455" font-size="10" fill="#6b7280" text-anchor="middle">消息发布</text>

  <!-- 7.5 数据层 → MySQL 灰盒通过 7.2 投递调度→MySQL 间接表达, 此处不画直接连线, 避免重复 -->

  <!-- ========================================================== -->
  <!-- 8. 图例 -->
  <!-- ============================================================ -->
  <rect x="50" y="790" width="1100" height="30" fill="#F8F9FA" stroke="#E2E8F0" stroke-width="1"/>
  <text x="70" y="810" font-size="11" font-weight="bold" fill="#1f2937">图例:</text>
  <rect x="120" y="800" width="20" height="14" fill="#E0F2FE" stroke="#1A73E8"/>
  <text x="145" y="812" font-size="10" fill="#1f2937">内部组件</text>
  <rect x="230" y="800" width="20" height="14" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="255" y="812" font-size="10" fill="#1f2937">外部容器(灰盒)</text>
  <circle cx="380" cy="807" r="6" fill="#ffffff" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="393" y="812" font-size="10" fill="#1f2937">对外接口</text>
  <line x1="460" y1="807" x2="490" y2="807" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-dep)"/>
  <text x="498" y="812" font-size="10" fill="#1f2937">内部依赖</text>
  <line x1="570" y1="807" x2="600" y2="807" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow-ext)"/>
  <text x="608" y="812" font-size="10" fill="#1f2937">外部交互</text>
</svg>
