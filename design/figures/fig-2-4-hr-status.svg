<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" style="background:#ffffff;font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 0 L 9 5 L 1 10" fill="none" stroke="#666666" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 0 L 9 5 L 1 10" fill="none" stroke="#999999" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-sync-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="590" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">图 2-4  HR 状态感知（Best-Effort 轮询）时序图</text>

  <!-- 参与者头部 -->
  <rect x="75" y="64" width="150" height="42" rx="6" fill="#1A73E8"/>
  <text x="150" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Java 状态机（服务端）</text>
  <rect x="305" y="64" width="130" height="42" rx="6" fill="#1A73E8"/>
  <text x="370" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">本机 Agent</text>
  <rect x="585" y="64" width="110" height="42" rx="6" fill="#9CA3AF"/>
  <text x="640" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">招聘平台</text>
  <rect x="875" y="64" width="90" height="42" rx="6" fill="#E8A317"/>
  <text x="920" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">用户</text>

  <!-- 生命线 -->
  <line x1="150" y1="106" x2="150" y2="650" stroke="#999999" stroke-width="1.5" stroke-dasharray="8,4"/>
  <line x1="370" y1="106" x2="370" y2="650" stroke="#999999" stroke-width="1.5" stroke-dasharray="8,4"/>
  <line x1="640" y1="106" x2="640" y2="650" stroke="#999999" stroke-width="1.5" stroke-dasharray="8,4"/>
  <line x1="920" y1="106" x2="920" y2="650" stroke="#999999" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- alt 组合片段（极细实线边框 + 圆角矩形 namebox） -->
  <rect x="96" y="398" width="920" height="204" fill="none" stroke="#AAAAAA" stroke-width="0.5"/>
  <rect x="96" y="398" width="52" height="22" rx="4" fill="#F5F5F5" stroke="#AAAAAA" stroke-width="0.5"/>
  <text x="122" y="413" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">alt</text>

  <!-- 激活条 -->
  <rect x="148" y="148" width="4" height="320" fill="#DBEAFE"/>
  <rect x="148" y="398" width="4" height="198" fill="#DBEAFE"/>
  <rect x="368" y="212" width="4" height="150" fill="#DBEAFE"/>
  <rect x="638" y="258" width="4" height="52" fill="#DBEAFE"/>

  <!-- ① 触发轮询（自调用） -->
  <path d="M 152 168 H 196 V 190 H 152" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="204" y="172" font-size="11" fill="#333333">按平台配置触发轮询（默认 6h/次）</text>

  <!-- ② 下发轮询指令（异步） -->
  <path d="M 152 232 L 366 232" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow-async)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11" fill="#333333">下发轮询指令（内部契约）</text>

  <!-- ③ 查询平台页面（同步） -->
  <path d="M 372 272 L 636 272" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="505" y="268" text-anchor="middle" font-size="11" fill="#333333">浏览器会话查询投递记录 / 沟通过页面（本地 Cookie）</text>

  <!-- ④ 返回页面状态（返回） -->
  <path d="M 640 306 L 374 306" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-return)"/>
  <text x="505" y="302" text-anchor="middle" font-size="11" fill="#333333">返回状态：viewed / contacting / unknown</text>

  <!-- ⑤ 状态回写（异步） -->
  <path d="M 368 352 L 154 352" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow-async)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#333333">回写状态码 + 证据快照（截图，供复核）</text>

  <!-- 分支一：viewed / contacting -->
  <path d="M 152 450 L 916 450" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow-async)"/>
  <text x="534" y="446" text-anchor="middle" font-size="11" fill="#333333">推进状态机（viewed→contacting）· 增强推送（WebSocket / 邮件 / 短信）</text>

  <!-- 分隔线 -->
  <line x1="104" y1="506" x2="1008" y2="506" stroke="#D0D0D0" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- 分支二：unknown / 失败 -->
  <text x="152" y="540" font-size="11" fill="#333333">失败 / unknown：保持原状态 · 记日志静默跳过，不阻塞任何流程</text>
  <text x="152" y="560" font-size="11" fill="#333333">轮询是 Best-Effort：超时 / 异常一律记日志，不构成硬依赖</text>

  <!-- 图例 -->
  <rect x="160" y="678" width="860" height="60" rx="6" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="175" y="697" font-size="11" font-weight="bold" fill="#1f2937">图例</text>

  <line x1="270" y1="697" x2="320" y2="697" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="326" y="700" font-size="10" fill="#333333">同步调用</text>
  <line x1="450" y1="697" x2="500" y2="697" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow-async)"/>
  <text x="506" y="700" font-size="10" fill="#333333">异步消息</text>
  <line x1="630" y1="697" x2="680" y2="697" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-return)"/>
  <text x="686" y="700" font-size="10" fill="#333333">返回 / 异常</text>

  <rect x="800" y="689" width="30" height="16" rx="3" fill="#F5F5F5" stroke="#AAAAAA" stroke-width="0.5"/>
  <text x="836" y="700" font-size="10" fill="#333333">alt 条件分支</text>

  <rect x="270" y="720" width="4" height="14" fill="#DBEAFE"/>
  <text x="280" y="728" font-size="10" fill="#333333">激活条（生命线活跃期）</text>
</svg>