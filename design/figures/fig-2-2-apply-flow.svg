<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" style="background:#ffffff;font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 0 L 9 5 L 1 10" fill="none" stroke="#666666" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 0 L 9 5 L 1 10" fill="none" stroke="#999999" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="700" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">图 2-2  批量投递闭环时序图</text>
  <text x="700" y="50" text-anchor="middle" font-size="10" fill="#6B7280">确认队列 → 任务入库 → MQ 下发 → 本机 Agent 执行 → 状态回写 → 推送通知</text>

  <!-- 参与者头部：参与者 #E8A317 · 系统 #1A73E8 · 外部系统 #9CA3AF -->
  <rect x="90" y="64" width="100" height="42" rx="6" fill="#E8A317"/>
  <text x="140" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">用户</text>
  <text x="140" y="103" text-anchor="middle" font-size="10" fill="#FFFFFF">求职者</text>

  <rect x="270" y="64" width="100" height="42" rx="6" fill="#1A73E8"/>
  <text x="320" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">客户端</text>
  <text x="320" y="103" text-anchor="middle" font-size="10" fill="#FFFFFF">Web / App</text>

  <rect x="450" y="64" width="100" height="42" rx="6" fill="#1A73E8"/>
  <text x="500" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Java 调度</text>
  <text x="500" y="103" text-anchor="middle" font-size="10" fill="#FFFFFF">状态机</text>

  <rect x="610" y="64" width="100" height="42" rx="6" fill="#1A73E8"/>
  <text x="660" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">MySQL</text>
  <text x="660" y="103" text-anchor="middle" font-size="10" fill="#FFFFFF">任务表</text>

  <rect x="770" y="64" width="100" height="42" rx="6" fill="#1A73E8"/>
  <text x="820" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">RabbitMQ</text>
  <text x="820" y="103" text-anchor="middle" font-size="10" fill="#FFFFFF">任务队列</text>

  <rect x="950" y="64" width="100" height="42" rx="6" fill="#1A73E8"/>
  <text x="1000" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">本机 Agent</text>
  <text x="1000" y="103" text-anchor="middle" font-size="10" fill="#FFFFFF">本地实例池</text>

  <rect x="1140" y="64" width="120" height="42" rx="6" fill="#9CA3AF"/>
  <text x="1200" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">招聘平台</text>
  <text x="1200" y="103" text-anchor="middle" font-size="10" fill="#FFFFFF">BOSS / 猎聘 / …</text>

  <!-- 生命线 -->
  <line x1="140" y1="106" x2="140" y2="660" stroke="#999999" stroke-width="1.5" stroke-dasharray="8,4"/>
  <line x1="320" y1="106" x2="320" y2="660" stroke="#999999" stroke-width="1.5" stroke-dasharray="8,4"/>
  <line x1="500" y1="106" x2="500" y2="660" stroke="#999999" stroke-width="1.5" stroke-dasharray="8,4"/>
  <line x1="660" y1="106" x2="660" y2="660" stroke="#999999" stroke-width="1.5" stroke-dasharray="8,4"/>
  <line x1="820" y1="106" x2="820" y2="660" stroke="#999999" stroke-width="1.5" stroke-dasharray="8,4"/>
  <line x1="1000" y1="106" x2="1000" y2="660" stroke="#999999" stroke-width="1.5" stroke-dasharray="8,4"/>
  <line x1="1200" y1="106" x2="1200" y2="660" stroke="#999999" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- 激活条 -->
  <rect x="318" y="148" width="4" height="84" fill="#DBEAFE"/>
  <rect x="498" y="190" width="4" height="122" fill="#DBEAFE"/>
  <rect x="658" y="246" width="4" height="26" fill="#DBEAFE"/>
  <rect x="818" y="288" width="4" height="64" fill="#DBEAFE"/>
  <rect x="998" y="328" width="4" height="164" fill="#DBEAFE"/>
  <rect x="1198" y="408" width="4" height="48" fill="#DBEAFE"/>
  <rect x="498" y="488" width="4" height="104" fill="#DBEAFE"/>

  <!-- ① 确认投递队列（同步） -->
  <path d="M 142 168 L 316 168" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="230" y="164" text-anchor="middle" font-size="11" fill="#333333">确认投递队列</text>

  <!-- ② 发起批量投递（同步） -->
  <path d="M 322 208 L 496 208" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="410" y="204" text-anchor="middle" font-size="11" fill="#333333">POST /api/apply/batch</text>

  <!-- ③ 写任务表（同步） -->
  <path d="M 502 248 L 656 248" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="580" y="244" text-anchor="middle" font-size="11" fill="#333333">INSERT 任务表</text>

  <!-- ④ 任务下发（异步） -->
  <path d="M 502 288 L 816 288" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow-async)"/>
  <text x="660" y="284" text-anchor="middle" font-size="11" fill="#333333">任务下发</text>

  <!-- ⑤ 拉取任务（异步） -->
  <path d="M 822 328 L 996 328" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow-async)"/>
  <text x="910" y="324" text-anchor="middle" font-size="11" fill="#333333">拉取任务（长连接）</text>

  <!-- ⑥ 分配实例（自调用） -->
  <path d="M 1002 368 H 1040 V 390 H 1002" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="1052" y="372" font-size="11" fill="#333333">分配浏览器实例（≤3）</text>
  <text x="1052" y="388" font-size="11" fill="#333333">加载本地 Cookie</text>

  <!-- ⑦ 浏览器会话执行投递（同步） -->
  <path d="M 1002 428 L 1196 428" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="1100" y="424" text-anchor="middle" font-size="11" fill="#333333">浏览器会话执行投递</text>

  <!-- ⑧ 返回投递结果（返回） -->
  <path d="M 1202 452 L 1000 452" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-return)"/>
  <text x="1100" y="448" text-anchor="middle" font-size="11" fill="#333333">成功 / 失败 / 验证码</text>

  <!-- ⑨ 状态事件回写（异步） -->
  <path d="M 998 496 L 502 496" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow-async)"/>
  <text x="750" y="492" text-anchor="middle" font-size="11" fill="#333333">状态事件回写</text>

  <!-- ⑩ 状态机推进 + 面试题生成（lifeline 标注） -->
  <text x="510" y="544" font-size="11" fill="#333333">状态机推进 + 面试题生成</text>

  <!-- ⑪ 推送通知（异步） -->
  <path d="M 498 588 L 142 588" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow-async)"/>
  <text x="320" y="584" text-anchor="middle" font-size="11" fill="#333333">推送通知：WebSocket / 邮件 / 短信</text>

  <!-- 图例 -->
  <rect x="280" y="678" width="860" height="60" rx="6" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="295" y="697" font-size="11" font-weight="bold" fill="#1f2937">图例</text>

  <line x1="390" y1="697" x2="440" y2="697" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
  <text x="446" y="700" font-size="10" fill="#333333">同步调用</text>
  <line x1="570" y1="697" x2="620" y2="697" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow-async)"/>
  <text x="626" y="700" font-size="10" fill="#333333">异步消息</text>
  <line x1="750" y1="697" x2="800" y2="697" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-return)"/>
  <text x="806" y="700" font-size="10" fill="#333333">返回 / 异常</text>

  <rect x="920" y="689" width="30" height="16" rx="3" fill="#F5F5F5" stroke="#AAAAAA" stroke-width="0.5"/>
  <text x="956" y="700" font-size="10" fill="#333333">alt 条件分支</text>

  <rect x="390" y="720" width="4" height="14" fill="#DBEAFE"/>
  <text x="400" y="728" font-size="10" fill="#333333">激活条（生命线活跃期）</text>
</svg>