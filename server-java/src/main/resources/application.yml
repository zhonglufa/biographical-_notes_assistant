server:
  port: 8080

spring:
  # 安全策略：由 SecurityConfig 自定义 SecurityFilterChain（permitAll + JwtAuthFilter + PermissionInterceptor）
  # 接管。Spring Boot 一旦发现自定义 SecurityFilterChain bean，默认 HTTP Basic 拦截链即不再创建，
  # 因此【无需】exclude SecurityAutoConfiguration——否则反而关掉了提供 HttpSecurity bean 的自动配置，
  # 导致 SecurityConfig.filterChain(HttpSecurity) 注入失败、context 起不来。
  # 仅排除管理端点/响应式安全自动配置（本服务为 servlet，不相关）。
  autoconfigure:
    exclude: >
      org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration,
      org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
  application:
    name: resume-ai-server-java
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/resume_ai?useSSL=false&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}

resumeai:
  jwt:
    issuer: resume-ai
    access-ttl-seconds: 3600
    refresh-ttl-seconds: 2592000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
